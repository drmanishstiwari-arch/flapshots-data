let io, seenTimer={};
/* Cards are rendered in batches as you swipe, not all at once: with 250+ cards the full feed froze phones after the intro. */
const BATCH=20, OLD_KEEP=20;
let items=[], itemPos=0, doneN=0;
function itemHTML(it){return it.k==='card'?cardHTML(it.c):it.k==='tip'?tipHTML(it.t):joinHTML();}
function renderMore(n=BATCH){
  if(itemPos>=items.length)return false;
  const chunk=items.slice(itemPos,itemPos+n); itemPos+=chunk.length;
  let html=chunk.map(itemHTML).join(''); if(itemPos>=items.length&&tab==='feed') html+=doneHTML(doneN);
  feed.insertAdjacentHTML('beforeend',html); wireTips(); observe(); wireDone();
  return true;
}
function wireDone(){const r=$('relook'), cn=$('checknew'); if(r) r.onclick=()=>feed.scrollTo({top:0,behavior:'smooth'}); if(cn) cn.onclick=checkNew;}
function render(scrollToFresh=true){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  renderChips();
  pendingLive=0; renderedLive=liveCards.length;
  let start=0; items=[]; itemPos=0; feed.innerHTML='';
  if(tab==='saved'){
    const list=[...liveCards,...LIB].filter(c=>S.saved[c.id]&&topicOk(c));
    if(!list.length) feed.innerHTML=`<div class="empty"><div><b>Nothing saved yet.</b><br>Tap the bookmark on any card to keep it here.</div></div>`;
    items=list.map(c=>({k:'card',c}));
  } else {
    let {old,fresh}=feedList();
    doneN=old.length+fresh.length;
    old=old.slice(-OLD_KEEP);
    const fh=fresh.map(c=>({k:'card',c})); if(!S.profile&&fh.length>6) fh.splice(6,0,{k:'join'});
    { // a calm Daily tips stop after every 10 swipes, in every feed
      const at=[];for(let p=10;p<fh.length;p+=10)at.push(p);
      const tp=tipsForFeed(at.length); for(let j=at.length-1;j>=0;j--) fh.splice(at[j],0,{k:'tip',t:tp[j]});
    }
    items=[...old.map(c=>({k:'card',c})),...fh];
    start=old.length;
  }
  renderMore(start+BATCH);
  if(tab==='feed'&&!items.length) feed.insertAdjacentHTML('beforeend',doneHTML(doneN)),wireDone();
  requestAnimationFrame(()=>{feed.scrollTop=scrollToFresh?start*feed.clientHeight:0;});
  updatePill();
}
/* shrink text to fit, one card at a time as it comes into view (doing every card at once was slow on phones) */
function fitCard(card){
  const r=card.querySelector('.ribbon b'); if(r){r.style.fontSize='';let fs=parseFloat(getComputedStyle(r).fontSize);while(r.scrollHeight>r.clientHeight+1&&fs>12.5){fs-=.5;r.style.fontSize=fs+'px';}}
  const b=card.matches('.card[data-id]')&&card.querySelector('.body'), t=b&&b.querySelector('.take');
  if(t){t.style.fontSize='';let fs=parseFloat(getComputedStyle(t).fontSize);while(b.scrollHeight>b.clientHeight+1&&fs>12.5){fs-=.5;t.style.fontSize=fs+'px';}}
  card.dataset.fit='1';
}
function fitText(){
  feed.querySelectorAll('.card[data-fit]').forEach(c=>delete c.dataset.fit);
  const fr=feed.getBoundingClientRect();
  feed.querySelectorAll('.card').forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom>fr.top-fr.height&&r.top<fr.bottom+fr.height)fitCard(c);});
}
addEventListener('resize',()=>requestAnimationFrame(fitText));
document.fonts&&document.fonts.ready.then(()=>fitText());
function unseenCount(){if(tab!=='feed')return 0;const seen=new Set(S.seen);return allReleased().filter(c=>!seen.has(c.id)&&topicOk(c)).length;}
function updatePill(){
  const p=$('pill');
  if(pendingLive>0){p.className='pill live';p.textContent=`${pendingLive} new paper${pendingLive>1?'s':''} ↻`;p.tabIndex=0;return;}
  p.className='pill';p.tabIndex=-1;const u=unseenCount();p.textContent=tab==='saved'?`${Object.keys(S.saved).length} saved`:(u?`${u} new`:'All caught up');
}
function observe(){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{
    const el=e.target, id=el.dataset.id; el.classList.toggle('vis',e.isIntersecting);
    if(e.isIntersecting){
      if(!el.dataset.fit) fitCard(el);
      const nx=el.nextElementSibling; if(nx&&!nx.dataset.fit) fitCard(nx);
      const cards=feed.children; if(itemPos<items.length&&[...cards].indexOf(el)>=cards.length-6) renderMore();
    }
    if(!id)return;
    if(e.isIntersecting){seenTimer[id]=setTimeout(()=>{if(!S.seen.includes(id)){S.seen.push(id);persist();updatePill();onSeen();}},1200);}
    else clearTimeout(seenTimer[id]);
  }),{root:feed,threshold:.6});
  feed.querySelectorAll('.card:not([data-obs])').forEach(el=>{el.dataset.obs='1';io.observe(el);});
}
function checkNew(){
  if(liveCards.length!==renderedLive||unseenCount()>0){render();return;}
  refreshLive().then(()=>{if(liveCards.length!==renderedLive)render();else toast('No new shots yet. Check back later.');});
}


function toggle(kind,card){
  const id=card.dataset.id; S[kind][id]=!S[kind][id]; if(!S[kind][id]) delete S[kind][id]; persist(); syncSoon();
  card.querySelector(`[data-a="${kind==='liked'?'like':'save'}"]`).setAttribute('aria-pressed',!!S[kind][id]);
  if(kind==='saved'){toast(S.saved[id]?'Saved':'Removed from Saved');updatePill();}
}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}

const TIPS=[
 {id:'t-alt',icon:'wave',cat:'ALT flap',tip:'Mark ALT perforators with a handheld Doppler before you prep the thigh.',slides:[
  ['Why it matters','Skin perforators of the anterolateral thigh vary in number and position, and occasionally none is usable. Knowing where they are before the incision lets you centre the skin paddle and avoid a wasted dissection.'],
  ['How to do it','Draw a line from the anterior superior iliac spine to the outer edge of the kneecap. Most perforators lie within a few centimetres of its midpoint. Mark every clear signal before scrubbing.'],
  ['Watch out','A Doppler can pick up deeper vessels that are not true skin perforators. Make the medial incision first, find the perforator, then commit the paddle around it.'],
  ['Have a plan B','If no good perforator appears, move to an anteromedial thigh flap, a muscle-carrying flap or the other thigh. Mention this backup when you take consent.']]},
 {id:'t-ink',icon:'drop',cat:'Margins',tip:'Ink and orient the specimen yourself before it leaves the theatre.',slides:[
  ['Why it matters','Tissue shrinks after removal, and an unoriented specimen makes it hard for the pathologist to say which margin is close. Your orientation decides whether a close margin can be re-cut accurately.'],
  ['How to do it','Mark anterior, superior and deep surfaces with sutures or coloured ink, and add a labelled sketch or photo for the pathologist.'],
  ['Frozen sections','Take frozen sections from the specimen edge itself, labelled by site, rather than scraps from the wound bed.'],
  ['Team habit','A two-minute specimen huddle with the pathologist on complex cases saves days of confusion later.']]},
 {id:'t-pedicle',icon:'loop',cat:'Anastomosis',tip:'Recheck the lie of the pedicle after you turn the head and close the neck.',slides:[
  ['Why it matters','Many early flap failures come from a kink, twist or pressure on the pedicle rather than a poor anastomosis.'],
  ['How to do it','Lay the pedicle in a gentle curve, return the head to its resting position and confirm flow. Check again after skin closure.'],
  ['Watch out','Drains, a tight closure, a haematoma and tracheostomy ties can all squeeze the pedicle. Keep drains away from the vessels.'],
  ['On the ward','Nurse the head in neutral, avoid tight ties around the neck, and tell the nurses which side the pedicle lies.']]},
 {id:'t-pinprick',icon:'drop',cat:'Flap monitoring',tip:'A pinprick tells you more than a glance: bright red blood within seconds is reassuring.',slides:[
  ['Healthy flap','Pink and warm, refills briskly after gentle pressure, and bleeds bright red after a fine needle prick.'],
  ['Vein in trouble','Dark, swollen skin that refills very fast and oozes dark blood points to a venous problem, the commonest cause of early failure.'],
  ['Artery in trouble','Pale, cool skin with slow refill and no bleeding after a pinprick suggests the inflow has stopped.'],

  ['Back to the mouth','Begin swallowing therapy as soon as the surgeon allows, to avoid long-term tube dependence.']]},
 {id:'t-allen',icon:'heart',cat:'Radial forearm flap',tip:'Do an Allen test before you raise a radial forearm flap.',slides:[
  ['Why it matters','The hand is fed by both the radial and ulnar arteries. Taking the radial artery is safe only if the ulnar side can supply the whole hand.'],

function normMob(raw,country){
  const t=String(raw||'').trim(), dg=t.replace(/\D/g,'');
  if(dg.length<10||dg.length>15)return '';
  if(t.startsWith('+'))return '+'+dg;
  if(dg.length===10&&(!country||/india/i.test(country)))return '+91'+dg;
  if(dg.length===11&&dg[0]==='0')return '+91'+dg.slice(1);
  if(dg.length===12&&dg.startsWith('91'))return '+'+dg;
  return '+'+dg;
}
async function sendSignup(kind){

  const p=S.profile,f=SIGNUP.f,d=new URLSearchParams();

  put('name',p.name);put('role',p.role);put('focus',p.focus);put('institution',p.institution);put('city',p.city);put('country',p.country);
  put('regNo',p.regNo);put('email',p.email);put('digest',p.digest?'Yes':'No');put('topics',(S.interests||[]).join(', '));put('vid',S.vid);put('mobile',p.mobile);put('wa',p.wa?'Yes':'No');
  put('kind',f.mobile?kind:`${kind} | mobile: ${p.mobile||''}${p.wa?' (WhatsApp OK)':' (no WhatsApp)'}`);
  try{await fetch(SIGNUP.url,{method:'POST',mode:'no-cors',body:d});return true;}catch(e){return false;}
}

async function loadCards(){
  for(const u of CARDS_URLS){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Math.floor(Date.now()/3e5),{cache:'no-store'});
      if(!r.ok)continue;
      const j=await r.json(), arr=Array.isArray(j)?j:(j.cards||[]);
      const next=arr.map(d=>({...d,id:'db-'+d.id,live:true})).filter(valid).map(c=>({...c,tr:['a','r','g'].includes(c.tr)?c.tr:'g',rib:c.rib||'New evidence',ev:c.ev||'New paper',likes:+c.likes||0})).sort((a,b)=>String(b.addedAt||'').localeCompare(String(a.addedAt||'')));
      if(!next.length)continue;
      return next;
    }catch(e){}
  }
  return null;
}
async function refreshLive(){
  const next=await loadCards();
  if(!next){if(!liveCards.length)liveStatus='Could not reach the live library just now; showing the built-in cards.';return;}
  const grew=next.length!==liveCards.length;
  liveCards=next; if(booted) renderChips();
  const last=next[0]?.addedAt?new Date(next[0].addedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):null;
  liveStatus=`${next.length} cards added automatically from papers and news; latest ${last||'recently'}.`;
  if(!booted||!grew) return;
  const nNew=next.length-renderedLive;
  const onDone=(()=>{const d=$('done-card');if(!d)return false;const r=d.getBoundingClientRect(),f=feed.getBoundingClientRect();return Math.abs(r.top-f.top)<40;})();
  if(nNew>0){ if(onDone||!feed.querySelector('.card[data-id]')) render(); else {pendingLive=nNew;updatePill();} }
}
(async()=>{
  await refreshLive();
  const want=new URLSearchParams(location.search).get('c');
  if(want){const go=()=>{if(byId(want))openCard(want);};if(booted)go();else{const t=setInterval(()=>{if(booted){clearInterval(t);go();}},200);setTimeout(()=>clearInterval(t),15000);}}
  setInterval(refreshLive,30*60e3);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshLive();});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
