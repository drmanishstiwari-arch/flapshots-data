<style>
/* Layout: Inshorts-style column. Black chrome (tabs, bottom nav), one full-height card per swipe:
   image on top, dark one-line ribbon in the middle, 2-line headline + ~60-word takeaway below, small footer with actions.
   Overlays: animated splash logo, first-run track picker, bottom sheets. */
:root{
  --chrome:#000000; --chrome-ink:#FFFFFF; --chrome-dim:#8E8E93; --chrome-card:#1A1A1D;
  --card:#FFFFFF; --ink:#141414; --body:#3A3A3C; --muted:#8A8A8E; --line:#E5E5EA;
  --ribbon:#111113; --ribbon-ink:#FFFFFF; --ribbon-dim:#B8B8BE;
  --teal:#E0405F; --teal-ink:#FFFFFF; --heart:#E2475B; --sheet:#FFFFFF; --chip:#F0F0F3;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif; --f-hand:"Gaegu","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --card:#161618; --ink:#F2F2F7; --body:#C9C9CF; --muted:#8E8E93; --line:#2C2C2E;
  --ribbon:#2A2A2E; --ribbon-dim:#AEAEB2; --teal:#FF7F8E; --teal-ink:#2A0710; --sheet:#1C1C1E; --chip:#2C2C2E; color-scheme:dark } }
:root[data-theme="dark"]{
  --card:#161618; --ink:#F2F2F7; --body:#C9C9CF; --muted:#8E8E93; --line:#2C2C2E;
  --ribbon:#2A2A2E; --ribbon-dim:#AEAEB2; --teal:#FF7F8E; --teal-ink:#2A0710; --sheet:#1C1C1E; --chip:#2C2C2E; color-scheme:dark }

html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--chrome)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 14px;flex:0 0 auto}
.tabs{display:flex;gap:26px;min-width:0}
.tab{background:none;border:0;padding:4px 0;color:var(--chrome-dim);font:600 18px var(--f-body);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.tab[aria-selected="true"]{color:var(--chrome-ink);border-color:var(--chrome-ink)}
.pill{flex:0 0 auto;border:0;background:var(--chrome-card);color:var(--chrome-ink);font:600 12.5px var(--f-body);padding:7px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.live{background:var(--teal);color:var(--teal-ink);cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chrome-card);color:#D9D9DF;border-radius:999px;padding:8px 13px;font:600 13px var(--f-body);white-space:nowrap;cursor:pointer}
.chip i{font-style:normal;opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff}
.chip[aria-pressed="true"] i{opacity:.85}
/* gentle motion for cartoons and charts, only on the card in view */
.cb{transform-box:fill-box;transform-origin:50% 100%}
.card.vis .cb{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-4px) rotate(-2deg)}65%{transform:translateY(-1px) rotate(1.5deg)}}
.eye{transform-box:fill-box;transform-origin:center}
.card.vis .eye{animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bar{transform-box:fill-box;transform-origin:0 50%}
.card.vis .bar{animation:growx 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.trow{opacity:1}
.card.vis .trow{animation:rowin .5s ease-out both}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.statn{transform-box:fill-box;transform-origin:center}
.card.vis .statn{animation:popn .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;overflow:hidden}
.img{flex:0 0 auto;height:42%;background:#FFFDF8;position:relative;user-select:none;-webkit-user-select:none;cursor:pointer}
.img > svg:not(.burst){width:100%;height:100%;display:block}
.burst{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;opacity:0}
.burst.go{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.ribbon{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:var(--ribbon);color:var(--ribbon-ink);text-decoration:none;padding:10px 12px 10px 20px}
.ribbon b{flex:1;min-width:0;font-size:15.5px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ribbon span{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ribbon-ink);border:1px solid var(--ribbon-dim);border-radius:999px;padding:4px 8px;white-space:nowrap}
.body{flex:1;min-height:0;overflow:hidden;padding:16px 22px 6px;display:flex;flex-direction:column;gap:10px}
h2{flex:0 0 auto;margin:0;font-weight:700;font-size:21px;line-height:1.3;letter-spacing:-.01em;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.take{flex:0 0 auto;margin:0;font-size:17px;line-height:1.55;color:var(--body)}
.foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px 8px 22px}
.meta{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .fresh{color:var(--teal);font-weight:700}
.tool{background:none;border:0;color:var(--ink);padding:8px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"] svg{fill:currentColor}
.tool.like[aria-pressed="true"]{color:var(--heart)}
.done .body{justify-content:center;text-align:center;align-items:center;gap:12px}
.done .take{max-width:34ch}
.body > *{flex-shrink:0}
.cd{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 14.5px var(--f-body);cursor:pointer}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
nav.bottom{flex:0 0 auto;display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--chrome)}
.nb{background:none;border:0;color:var(--chrome-dim);padding:6px 18px;cursor:pointer}
.nb svg{width:26px;height:26px;fill:currentColor}
.nb[aria-current="true"]{color:var(--chrome-ink)}
button:focus-visible,a:focus-visible{outline:2px solid #5B8CFF;outline-offset:2px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--card);border-radius:18px 18px 0 0;padding:24px;line-height:1.5}
.sheet-wrap{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:480px;max-height:80%;overflow-y:auto;background:var(--sheet);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:17px;font-weight:800}
.sheet p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid button,.grid a{border:0;background:var(--chip);color:var(--ink);font:600 14px var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.grid [aria-pressed="true"]{background:var(--ink);color:var(--card)}
.close{background:none;border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:12px;font:600 14px var(--f-body);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:70;box-shadow:0 4px 18px rgb(0 0 0 / .25);white-space:nowrap}

/* splash: logo B. Coral tile spins in (3D), swipe card slides in, the flap leaf grows from its pedicle and sways to the right with a light sheen, wordmark flips in */
.splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;overflow:hidden;background:radial-gradient(120% 85% at 50% 38%,#6A2340 0%,#2A0E1B 55%,#12060C 100%);transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.orbs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(64px);opacity:.36;animation:drift 7s ease-in-out infinite alternate}
.orbs i:nth-child(1){background:#FF9B6B;left:-18vmax;top:-14vmax}
.orbs i:nth-child(2){background:#F0476E;right:-22vmax;top:22vh;animation-delay:-2.5s}
.orbs i:nth-child(3){background:#FFB86B;left:4vmax;bottom:-28vmax;animation-delay:-4.5s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.stage{perspective:800px}
.logo{width:156px;height:156px;display:block;filter:drop-shadow(0 22px 34px rgb(0 0 0 / .5)) drop-shadow(0 0 40px rgb(240 71 110 / .35))}
.logo .tile,.logo .scard,.logo .grow,.logo .sway{transform-box:view-box}
.logo .tile{transform-origin:60px 60px}
.logo .scard{transform-origin:60px 59px}
.logo .grow,.logo .sway{transform-origin:60px 94px}
.splash:not(.run) .logo{animation:breathe 2.6s ease-in-out infinite}
.logo .sway{animation:sway 2.6s ease-in-out infinite}
.run .logo{animation:spin 1.5s cubic-bezier(.18,.9,.25,1) both}
.run .logo .scard{animation:cardin .8s .7s cubic-bezier(.2,.9,.3,1.2) both}
.run .logo .grow{animation:growl 1s 1.1s cubic-bezier(.25,1.5,.5,1) both}
.run .logo .sway{animation:sway 2.6s 2.1s ease-in-out infinite}
.run .logo .vein{stroke-dasharray:60;animation:draw .9s 1.6s ease-out both}
.run .logo .ped{stroke-dasharray:40;animation:draw .6s 1.9s ease-out both}
.run .logo .sheen{animation:sheen 1.6s 2.3s ease-in-out infinite}
@keyframes spin{0%{transform:perspective(600px) rotateY(-540deg) rotateX(25deg) scale(.2);opacity:0}65%{transform:perspective(600px) rotateY(12deg) rotateX(-6deg) scale(1.07);opacity:1}100%{transform:perspective(600px) rotateY(0) scale(1);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes cardin{from{transform:translateX(50px) rotate(18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes growl{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0) skewX(0)}30%{transform:rotate(9deg) skewX(-5deg)}55%{transform:rotate(3deg) skewX(2deg)}75%{transform:rotate(7deg) skewX(-3deg)}}
@keyframes sheen{0%{transform:translateX(0)}70%,100%{transform:translateX(110px)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.word{font:800 46px "Plus Jakarta Sans",var(--f-body);letter-spacing:-.025em;white-space:nowrap;perspective:600px;color:#FFE9E2}
.word b{color:#FF7A6B;font-weight:800}
.word span{display:inline-block;text-shadow:0 2px 0 rgb(0 0 0 / .25),0 10px 22px rgb(0 0 0 / .45)}
.run .word span{animation:flip .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes flip{from{opacity:0;transform:rotateX(-100deg) translateY(16px)}to{opacity:1;transform:none}}
.tag{font:600 14.5px var(--f-body);color:#FFD9CF;text-align:center;padding-inline:24px}
.run .tag{animation:rise .6s 3s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.copy{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font:500 12px var(--f-body);color:rgb(255 225 214 / .7);letter-spacing:.02em}
.run .copy{animation:rise .6s 3.2s ease-out both}
.tapgo{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:800 16px var(--f-body);cursor:pointer;box-shadow:0 10px 30px rgb(240 71 110 / .45);animation:tappulse 1.6s ease-in-out infinite}
.tapgo svg{width:18px;height:18px;fill:currentColor}
@keyframes tappulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgb(240 71 110 / .45)}50%{transform:scale(1.06);box-shadow:0 10px 44px rgb(240 71 110 / .75)}}
.run .tapgo{display:none}
.a2hs{display:flex;gap:14px;align-items:center}.a2hs svg{width:58px;height:58px;flex:0 0 auto;border-radius:14px}.a2hs div{display:flex;flex-direction:column;gap:4px}.a2steps{color:var(--ink)!important}.obnote{margin:6px 0 0;font-size:13px;opacity:.75;text-align:center}
.pickbar{display:flex;justify-content:flex-end;margin:4px 0 -2px}.selall{border:1px solid rgb(255 255 255 / .35);background:transparent;color:#FFB9A8;font:700 13.5px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.ios-guide{display:flex;flex-direction:column;gap:12px}
.ig-lead{color:var(--ink)!important}
.ig-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ig-steps li{display:flex;gap:12px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:12px;color:var(--ink);font-size:15px;line-height:1.45}
.ig-n{flex:0 0 26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.ig-steps .ic{width:22px;height:22px;vertical-align:-6px;margin:0 2px}
.ig-sub{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.ig-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-weight:600;white-space:nowrap}
.ig-pill .ic{width:18px;height:18px;margin:0}
.ig-add{color:#0A84FF;font-weight:700}
.ig-small{font-size:13px!important}
.ig-done{align-self:center;background:none;border:0;color:var(--muted);font:600 13.5px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
.ig-arrow{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#0A84FF;display:grid;place-items:center;z-index:31;box-shadow:0 6px 20px rgb(10 132 255 / .5);animation:igb 1.2s ease-in-out infinite}
.ig-arrow svg{width:24px;height:24px}
@keyframes igb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.sheet:has(.ig-arrow){padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.ios-banner{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:460px;margin:0 auto;z-index:28;display:flex;align-items:center;gap:10px;background:#1C1C1E;color:#fff;border-radius:16px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgb(0 0 0 / .45);animation:rise .4s ease-out}
.ios-banner svg{width:40px;height:40px;flex:0 0 auto;border-radius:10px}
.ib-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.ib-t b{font-size:14px}.ib-t span{font-size:12.5px;color:#B8B8BE}
.ib-how{border:0;border-radius:999px;background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff;font:700 13.5px var(--f-body);padding:8px 14px;cursor:pointer}
.ib-x{border:0;background:none;color:#B8B8BE;font-size:22px;line-height:1;padding:4px 6px;cursor:pointer}
.fserr{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fdd;font:12px/1.4 monospace;padding:8px;border-radius:8px;white-space:pre-wrap}
.sound{position:absolute;bottom:calc(52px + env(safe-area-inset-bottom,0px));background:rgb(255 255 255 / .1);color:#FFE9E2;border:1px solid rgb(255 255 255 / .25);border-radius:999px;padding:9px 16px;font:600 13px var(--f-body);cursor:pointer;backdrop-filter:blur(6px)}
.sound svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px;fill:currentColor}

/* header goal ring + streak */
.tr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.goal{display:flex;align-items:center;gap:3px;background:var(--chrome-card);border:0;border-radius:999px;padding:3px 10px 3px 3px;color:#fff;font:700 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.goal svg:first-child{width:28px;height:28px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#3A3A40;stroke-width:3}
.ring-fg{fill:none;stroke:#FF7A6B;stroke-width:3;stroke-linecap:round;stroke-dasharray:69.1;stroke-dashoffset:69.1;transition:stroke-dashoffset .6s}
.goal .flame{width:14px;height:14px;fill:#FF9B6B;margin-left:2px}
.tab{font-size:17px}
.tabs{gap:20px}
/* text size preference */
:root[data-ts="s"] .take{font-size:15px}
:root[data-ts="l"] .take{font-size:19px;line-height:1.5}
/* profile, search, admin, forms */
.prof{display:flex;align-items:center;gap:12px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff;font:800 18px var(--f-body);flex:0 0 auto}
.pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.pn b{font-size:17px}.pn span{color:var(--muted);font-size:13.5px}

.vb.ok{color:#1F9E7A}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--chip);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:17px;font-variant-numeric:tabular-nums}.stats span{font-size:11.5px;color:var(--muted)}
.danger{color:var(--heart)!important}
.legal p{margin:0 0 10px;color:var(--ink);font-size:14px;line-height:1.55}
.sinput{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:12px;font:500 15px var(--f-body);resize:vertical}
.sres{display:flex;flex-direction:column;gap:6px}
.sr{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;font-family:var(--f-body)}
.sr b{font-size:14px}.sr span,.cnt{font-size:12px;color:var(--muted)}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--chip);border-radius:12px;padding:10px 12px}
.arow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.arow b{font-size:14px}.arow span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.arow button{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;font:700 12.5px var(--f-body);background:var(--card);color:var(--ink);cursor:pointer}
.arow button[aria-pressed="true"]{background:#1F9E7A;color:#fff}
.vp{margin:4px 0 8px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.vp li{color:#C9C9D1;font-size:15px;line-height:1.45;padding-left:22px;position:relative}
.vp li::before{content:"";position:absolute;left:0;top:7px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#FF9B6B,#F0476E)}
.vp b{color:#fff}
.ghostbtn{background:transparent;color:#fff;border:1px solid #3A3A40;border-radius:14px;padding:14px;font:700 15px var(--f-body);cursor:pointer}
.lnk{background:none;border:0;padding:0;color:#FF9B8B;text-decoration:underline;font:inherit;cursor:pointer}
.f label{font-size:13px;font-weight:600;color:#C9C9CF;margin-top:4px}
.f input:not([type=checkbox]),.f select{width:100%;box-sizing:border-box;background:#1A1A1D;color:#fff;border:1px solid #34343A;border-radius:12px;padding:12px;font:500 15px var(--f-body)}
.f input:focus,.f select:focus{outline:2px solid #FF7A6B;outline-offset:1px}
.f .chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:#D5D5DB;line-height:1.4;font-size:14px}
.f .chk input{width:18px;height:18px;margin-top:1px;accent-color:#F0476E;flex:0 0 auto}
.opt-l{font-weight:500;color:#85858D}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two div{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg,.pick{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.pick button{border:1px solid #34343A;background:#1A1A1D;color:#E5E5EA;border-radius:999px;padding:9px 14px;font:600 14px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:linear-gradient(135deg,#FF9B6B,#F0476E);border-color:transparent;color:#fff}
.steps{font-size:12.5px;color:#9A9AA2;letter-spacing:.02em}.steps b{color:#FF9B8B}
.err{color:#FF8A8A;min-height:1em;margin:0!important;font-size:14px}
.join .row{margin-top:4px}
/* onboarding */
.onboard{position:fixed;inset:0;background:#000;color:#fff;z-index:25;display:flex;justify-content:center;overflow-y:auto}
.ob{width:100%;max-width:480px;padding:48px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ob h1{margin:0;font:800 28px/1.15 var(--f-body);letter-spacing:-.02em;text-wrap:balance}
.ob p{margin:0 0 8px;color:#A1A1A8;font-size:15px;line-height:1.5}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#1A1A1D;color:#fff;border:2px solid transparent;border-radius:18px;padding:12px 16px 12px 10px;cursor:pointer;font-family:var(--f-body)}
.opt svg{flex:0 0 auto;width:78px;height:64px;background:#FFFDF8;border-radius:12px}
.opt b{display:block;font-size:17px;margin-bottom:3px}
.opt span{font-size:13.5px;color:#A1A1A8;line-height:1.4}
.opt[aria-pressed="true"]{border-color:#FF7A6B;background:#2A1218}
.start{margin-top:auto;background:linear-gradient(135deg,#FF9B6B,#F0476E);color:#fff;border:0;border-radius:14px;padding:15px;font:800 16px var(--f-body);cursor:pointer}
.start:disabled{opacity:.35;cursor:default}
.obrand{display:flex;align-items:center;gap:10px;font:800 22px "Plus Jakarta Sans",var(--f-body);color:#FFE9E2;letter-spacing:-.02em}
.obrand svg{width:40px;height:40px}
.obrand b{color:#FF7A6B}
.obcopy{text-align:center;color:#77777F;font-size:12px}
@media (max-height:700px){.take{font-size:15.5px;line-height:1.45}.img{height:38%}}
@media (prefers-reduced-motion: reduce){.card.vis .cb,.card.vis .eye,.card.vis .bar,.card.vis .trow,.card.vis .statn{animation:none!important}.burst.go{animation:none!important}}

.tp-amb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tp-amb i{position:absolute;border-radius:50%;filter:blur(38px);opacity:var(--tp-amb,.55)}
.tp-amb i:first-child{width:62%;aspect-ratio:1;background:var(--tp-sage);top:-12%;left:-18%}
.tp-amb i:last-child{width:55%;aspect-ratio:1;background:var(--tp-rose);bottom:-10%;right:-16%;opacity:calc(var(--tp-amb,.55)*.75)}
.tipcard.vis .tp-amb i{animation:tpdrift 14s ease-in-out infinite alternate}
.tipcard.vis .tp-amb i:last-child{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes tpdrift{to{transform:translate(12%,9%) scale(1.12)}}
.tp-head{position:relative;display:flex;justify-content:space-between;align-items:center;padding:16px 22px 6px;font-size:13px}
.tp-lbl{display:inline-flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--tp-sage-d)}
.tp-lbl svg{width:18px;height:18px}
.tp-n{font-variant-numeric:tabular-nums;opacity:.65}
.tp-rail{position:relative;flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.tp-rail::-webkit-scrollbar{display:none}
.tp-slide{box-sizing:border-box;flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:8px 20px 6px;display:flex;min-height:0}
.tp-frame{box-sizing:border-box;position:relative;flex:1;border-radius:26px;border:1.5px solid var(--tp-line);background:var(--tp-frame);box-shadow:inset 0 0 0 6px var(--tp-inset,rgba(255,255,255,.18)),0 10px 30px rgba(52,67,58,.08);padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tp-frame::before{content:"";position:absolute;inset:10px;border-radius:19px;border:1px dashed var(--tp-line);pointer-events:none}
.tp-first{align-items:center;text-align:center}
.tp-first .bulb{width:min(48%,190px);height:auto;overflow:visible}
.tipcard.vis .bulb{animation:tpfloat 5s ease-in-out infinite}
.bulb .glow{transform-origin:60px 52px;opacity:.7}
.tipcard.vis .bulb .glow{animation:tpglow 4s ease-in-out infinite}
.bulb .rays{transform-origin:60px 52px;opacity:.85}
.tipcard.vis .bulb .rays{animation:tpspin 40s linear infinite}
@keyframes tpfloat{50%{transform:translateY(-6px)}}
@keyframes tpglow{50%{opacity:1;transform:scale(1.08)}}
@keyframes tpspin{to{transform:rotate(360deg)}}
.tp-cat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:rgba(169,201,175,.35);color:var(--tp-sage-d)}
.tp-tip{font-family:Lora,Georgia,serif;font-style:italic;font-size:clamp(21px,6.2vw,28px);line-height:1.38;margin:2px 4px;color:var(--tp-ink);text-wrap:balance}
.tp-hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;opacity:.7;margin-top:4px}
.tp-hint svg{width:16px;height:16px}
.tipcard.vis .tp-hint svg{animation:tpnudge 2.2s ease-in-out infinite}
@keyframes tpnudge{50%{transform:translateX(6px)}}
.tp-step{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--tp-sage);color:#fff;box-shadow:0 0 0 6px rgba(169,201,175,.25)}
.tp-frame h3{margin:4px 0 0;font-family:Lora,Georgia,serif;font-size:clamp(21px,5.4vw,25px);font-weight:600;color:var(--tp-ink)}
.tp-frame p{margin:0;font-size:clamp(15.5px,4.2vw,17.5px);line-height:1.6;color:var(--tp-ink);opacity:.88}
.tp-end{margin-top:6px;font-size:13px;font-weight:600;color:var(--tp-sage-d)}
.tp-sprig{position:absolute;right:18px;bottom:16px;width:64px;opacity:.8}
.tp-dots{position:relative;display:flex;justify-content:center;gap:7px;padding:10px 0 16px}
.tp-dots i{width:7px;height:7px;border-radius:99px;background:var(--tp-sage-d);opacity:.3;transition:all .35s ease}
.tp-dots i.on{width:22px;opacity:.9}
@media (prefers-reduced-motion: reduce){.tipcard *{animation:none!important}}

  {bg:'mint',cap:["TP53 IS THE","CELL'S GUARD."],ch:[{k:'dna',m:'happy',x:.5,l:'TP53'}]},
  {bg:'lilac',cap:["TOBACCO BREAKS","THE GUARD."],ch:[{k:'dna',m:'sad',x:.5}]},
  {bg:'pink',cap:["DAMAGED CELLS","MULTIPLY."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'butter',cap:["NO PILL YET;","PREVENTION WINS."],ch:[{k:'doc',m:'calm',x:.5}]}],
 head:"TP53, the guardian gene, is broken in most tobacco cancers",
 take:"TP53 is the gene that stops damaged cells from dividing. The Cancer Genome Atlas found it mutated in most tobacco-related head and neck cancers, often alongside CDKN2A, another brake on cell growth. There is no TP53 pill yet, but it explains why these cancers grow fast and why the whole tobacco-exposed lining stays at risk.",
 rib:"Tobacco knocks out TP53, the gene that stops damaged cells dividing",more:"Read the paper",u:"https://www.nature.com/articles/nature14129",likes:1033},

{id:'kn689',tr:'a',cat:'Immunotherapy',ev:'RCT · NEJM 2025 · Practice-changing',
 fig:{type:'bars',title:'Median event-free survival',unit:' mo',bars:[{l:'Standard care',v:30.4},{l:'+ Pembrolizumab before and after surgery',v:51.8,hi:1}],from:'KEYNOTE-689, NEJM 2025',ch:'vial'},
 head:"Pembrolizumab before surgery cuts relapse in advanced cancer",
 take:"In KEYNOTE-689 (714 patients), two doses of pembrolizumab before surgery, continued afterwards with radiotherapy, cut the risk of the cancer returning by 30% in PD-L1 positive tumours. Side effects rarely delayed surgery. Survival data are still maturing. The US FDA approved this in June 2025, so ask for PD-L1 testing on the biopsy.",
 rib:"Test PD-L1; pembrolizumab around surgery cuts relapse",more:"Read the trial",u:"https://www.nejm.org/doi/full/10.1056/NEJMoa2415434",likes:2611},

{id:'failure',tr:'r',cat:'Flap failure',ev:'Cohort studies',
 panels:[
  {bg:'pink',cap:["FLAP TURNS BLUE","AND SWOLLEN."],ch:[{k:'flap',m:'sad',bad:true,x:.5}]},
  {bg:'lilac',cap:["MOST CLOTS COME","IN 48 HOURS."],ch:[{k:'clock',x:.5}]},
  {bg:'butter',cap:["BACK TO OT","WITHIN HOURS."],ch:[{k:'doc',m:'angry',x:.5,l:'GO NOW'}]},
  {bg:'mint',cap:["EARLY RETURN,","FLAP SAVED."],ch:[{k:'flap',m:'happy',x:.5}]}],
 head:"Most flap problems show within 48 hours; act within hours",
 take:"A flap that turns blue, swollen or pale usually means a vein or artery has clotted, most often in the first one to two days. The sooner it goes back to theatre, the more often it is saved. Hourly bedside checks of colour, refill and bleeding on the first day, plus a clear call-and-return rule, save flaps.",
 rib:"Check hourly on day one and re-explore within hours of trouble",more:"See the evidence",u:pm('free flap salvage timing head and neck'),likes:2034},

{id:'doi',tr:'a',cat:'Tongue cancer',ev:'Guideline · AJCC 8th / NCCN',
 fig:{type:'table',title:'T stage in mouth cancer (AJCC 8th, simplified)',cols:['T','Size','Depth of invasion'],w:[1,3,3],rows:[['T1','2 cm or less','and 5 mm or less'],['T2','Up to 4 cm','up to 10 mm'],['T3','More than 4 cm','or more than 10 mm'],['T4a','Into bone, sinus or facial skin','any depth']],hi:2,from:'AJCC Cancer Staging Manual, 8th edition'},
 head:"In tongue cancer, depth matters more than width",
 take:"Two tongue cancers can look the same size on the surface, but the one growing deeper is more dangerous. Staging now counts depth: over 10 mm makes it T3 even when small. Deeper tumours hide neck spread more often, and guidelines advise treating the neck once depth passes 4 mm. Ask your pathologist to report depth in millimetres.",
 rib:"Report depth of invasion in mm; deeper than 4 mm, treat the neck",more:"See the guideline",u:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1437",likes:1390},

{id:'eras',tr:'g',cat:'Postoperative care',ev:'Guideline · ERAS Society 2017',
 panels:[
  {bg:'butter',cap:["NO LONG FASTING;","CARB DRINK."],ch:[{k:'vial',m:'happy',x:.5,l:'CARB DRINK'}]},
  {bg:'pink',cap:["ABOUT A DAY OF","ANTIBIOTICS."],ch:[{k:'vial',m:'calm',x:.5,l:'ANTIBIOTIC'}]},
  {bg:'lilac',cap:["LESS MORPHINE,","MIXED PAIN RELIEF."],ch:[{k:'blob',m:'calm',x:.5}]},
  {bg:'mint',cap:["UP AND WALKING","EARLY."],ch:[{k:'blob',m:'happy',x:.5,l:'PATIENT'}]}],
 head:"Simple care bundles speed recovery after flap surgery",
 take:"The ERAS Society's advice for major head and neck flap surgery is a set of small habits: no long fasting, a carbohydrate drink before surgery, about a day of antibiotics rather than a week, clot prevention, careful fluids, less morphine with mixed pain relief, and getting patients up early. A printed order set keeps the whole team on the same plan.",
 rib:"Short fasting, a day of antibiotics, less morphine and early walking",more:"Read the guideline",u:pm('Dort optimal perioperative care major head and neck cancer surgery free flap'),likes:988},

{id:'buccal',tr:'a',cat:'Buccal cancer',ev:'Expert view',
 panels:[
  {bg:'butter',cap:["A TOBACCO","CHEWER'S CHEEK."],ch:[{k:'blob',m:'worried',x:.5,l:'CHEEK'}]},
  {bg:'lilac',cap:["TUMOUR PUSHES","TOWARD SKIN."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'pink',cap:["SKIN TETHERED?","GO FULL THICKNESS."],ch:[{k:'doc',m:'calm',x:.5}]},
  {bg:'mint',cap:["REBUILD LINING","AND SKIN."],ch:[{k:'flap',m:'happy',x:.5,l:'FOLDED ALT'}]}],
 head:"Buccal cancer: check the cheek skin before planning surgery",
 take:"Cheek cancer is India's commonest mouth cancer, driven by chewing tobacco and areca nut. When the tumour sits close to the skin, removing the full thickness of the cheek is the safest way to clear margins. Feel the cheek and check the fat layer on MRI beforehand, so consent covers skin removal and the flap rebuilds both lining and skin.",
 rib:"Skin near the tumour? Go full thickness, rebuild lining and skin",more:"See the evidence",u:pm('buccal mucosa carcinoma through and through defect reconstruction'),likes:1105},

{id:'fibula',tr:'r',cat:'Fibula flap',ev:'Meta-analyses',
 panels:[
  {bg:'pink',cap:["A JAW SEGMENT","IS REMOVED."],ch:[{k:'bone',m:'worried',x:.5,l:'MANDIBLE'}]},
  {bg:'lilac',cap:["PLAN THE CUTS","ON A 3D MODEL."],ch:[{k:'screen',t:'3D',x:.5}]},
  {bg:'butter',cap:["PRINTED GUIDES","FIT THE BONE."],ch:[{k:'bone',m:'happy',x:.5,l:'FIBULA'}]},
  {bg:'mint',cap:["A BETTER-FITTING","NEW JAW."],ch:[{k:'blob',m:'happy',x:.5,l:'PATIENT'}]}],
 head:"Planning the new jaw on a computer gives a better fit",
 take:"With virtual surgical planning, the jaw and leg-bone cuts are designed on a 3D model and printed guides are used in theatre. Pooled studies show a more accurate jaw shape, better bone contact and less time with the flap off its blood supply. Cost and waiting time are the trade-offs. It helps most in complex, multi-piece jaw rebuilds.",
 rib:"Virtual planning and printed guides give a more accurate fibula jaw",more:"See the evidence",u:pm('virtual surgical planning fibula mandible reconstruction meta-analysis'),likes:1544},

{id:'opmd',tr:'g',cat:'Early detection',ev:'Guideline · WHO 2020',
 panels:[
  {bg:'butter',cap:["WHITE PATCH:","WATCH CLOSELY."],ch:[{k:'tongue',m:'calm',x:.5,l:'WHITE'}]},
  {bg:'pink',cap:["RED PATCH:","HIGHER RISK."],ch:[{k:'tongue',m:'worried',x:.5,l:'RED'}]},
  {bg:'lilac',cap:["NOT HEALED IN","2 WEEKS?"],ch:[{k:'clock',x:.5}]},
  {bg:'mint',cap:["BIOPSY,","NOT OINTMENT."],ch:[{k:'doc',m:'happy',x:.5}]}],
 head:"A red patch in the mouth worries more than a white one",
 take:"White patches (leukoplakia) are common; red patches (erythroplakia) are rarer but far more likely to be, or become, cancer. Submucous fibrosis from areca nut also carries risk. Any patch or ulcer that has not healed two weeks after removing the cause deserves a biopsy, not another course of ointment.",
 rib:"Red patch or ulcer not healed in 2 weeks: biopsy, not ointment",more:"See the evidence",u:pm('WHO 2020 oral potentially malignant disorders nomenclature classification'),likes:1721},

{id:'scapula',tr:'r',cat:'Scapula flap',ev:'Cohort studies',
 panels:[
  {bg:'butter',cap:["LEGS WITH POOR","CIRCULATION?"],ch:[{k:'bone',m:'sad',x:.5,l:'FIBULA'}]},
  {bg:'lilac',cap:["USE THE SHOULDER","BLADE TIP."],ch:[{k:'bone',m:'happy',x:.5,l:'SCAPULA'}]},
  {bg:'pink',cap:["PATIENT WALKS","EARLY."],ch:[{k:'blob',m:'happy',x:.5}]},
  {bg:'mint',cap:["GREAT FOR THE","UPPER JAW."],ch:[{k:'doc',m:'happy',x:.5}]}],
 head:"Shoulder-blade tip flap: the backup when leg vessels are poor",
 take:"Older patients often have narrowed leg arteries, which makes the fibula risky. The tip of the shoulder blade, fed by its own branch artery, gives bone on a long vessel without touching the leg, so patients walk early. It suits upper-jaw and palate defects well. The bone is thinner than fibula, so dental implants are less predictable.",
 rib:"Poor leg vessels? The scapular tip gives bone without touching the leg",more:"See the evidence",u:pm('scapular tip free flap head and neck reconstruction'),likes:876},

{id:'nivo',tr:'a',cat:'Systemic therapy',ev:'RCT · JCO 2023 · Tata Memorial',
 fig:{type:'bars',title:'1-year overall survival',unit:'%',bars:[{l:'Oral metronomic chemotherapy',v:6.7},{l:'+ Low-dose nivolumab (20 mg)',v:16.6,hi:1}],from:'Patil et al., JCO 2023',ch:'vial'},
 head:"Low-dose nivolumab adds survival at a fraction of the cost",
 take:"For recurrent or metastatic head and neck cancer, Tata Memorial added a tiny flat dose of nivolumab (20 mg every 3 weeks) to cheap oral metronomic chemotherapy. One-year survival rose from 6.7% to 16.6%. Full-dose immunotherapy is unaffordable for most Indian patients; this low-dose approach brings it within reach.",
 rib:"20 mg nivolumab plus oral metronomic chemo: survival, affordably",more:"Read the trial",u:pm('Patil low dose nivolumab metronomic head and neck J Clin Oncol 2023'),likes:2388},

{id:'itf',tr:'a',cat:'ITF clearance',ev:'Cohort studies · Indian series',
 panels:[
  {bg:'lilac',cap:["CANCER CREEPS","BEHIND THE CHEEK."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'pink',cap:["BELOW THE JAW","NOTCH?"],ch:[{k:'screen',t:'MRI',x:.5}]},
  {bg:'butter',cap:["REMOVE THE WHOLE","COMPARTMENT."],ch:[{k:'doc',m:'calm',x:.5,l:'EN BLOC'}]},
  {bg:'mint',cap:["CLEAR MARGINS,","BETTER CONTROL."],ch:[{k:'blob',m:'happy',x:.5,l:'PATIENT'}]}],
 head:"Cancer below the jaw notch is often still operable",
 take:"Gum and cheek cancers can spread backwards into the space behind the jaw. If the spread stays below the notch of the jawbone, the whole compartment can be removed in one block, with results close to other advanced mouth cancers in Indian series. Spread above the notch or to the skull base does worse. Read the MRI before calling it inoperable.",
 rib:"ITF spread below the sigmoid notch can be cleared en bloc",more:"See the evidence",u:pm('infratemporal fossa clearance oral cancer'),likes:1478},

{id:'monitor',tr:'r',cat:'Flap monitoring',ev:'Cohort studies',
 panels:[
  {bg:'mint',cap:["LOOK AT","THE COLOUR."],ch:[{k:'flap',m:'happy',x:.5}]},
  {bg:'butter',cap:["PRESS: QUICK","REFILL IS GOOD."],ch:[{k:'clock',x:.5}]},
  {bg:'lilac',cap:["BURIED FLAP?","USE A DOPPLER."],ch:[{k:'screen',t:'DOPPLER',x:.5,w:1.3}]},
  {bg:'pink',cap:["NURSE CALLS","EARLY."],ch:[{k:'doc',m:'calm',x:.5}]}],
 head:"A trained eye at the bedside is still the best flap monitor",
 take:"Colour, warmth, capillary refill and a pinprick bleed, checked often by trained nurses, catch most failing flaps. Implantable Dopplers help for buried flaps that cannot be seen. Smartphone photos shared with the surgeon speed decisions at night. The key is a clear schedule, hourly at first, and a low threshold to call.",
 rib:"Colour, refill and pinprick checks remain the best flap monitor",more:"See the evidence",u:pm('free flap monitoring methods head and neck review'),likes:1312},

{id:'hpv',tr:'g',cat:'HPV and oropharynx',ev:'Guideline · AJCC 8th',
 panels:[
  {bg:'pink',cap:["TONSIL CANCER","IN A NON-SMOKER?"],ch:[{k:'blob',m:'worried',x:.5}]},
  {bg:'lilac',cap:["HPV MAY BE","THE CAUSE."],ch:[{k:'tumour',m:'calm',x:.5,l:'HPV'}]},
  {bg:'butter',cap:["CHECK p16 ON","THE BIOPSY."],ch:[{k:'screen',t:'p16+',x:.5}]},
  {bg:'mint',cap:["BETTER OUTCOMES,","OWN STAGING."],ch:[{k:'blob',m:'happy',x:.5}]}],
 head:"HPV throat cancers are a different, more curable disease",
 take:"Cancers of the tonsil and tongue base caused by HPV behave differently from tobacco cancers: they occur in younger people, respond well to treatment and have their own staging system. A p16 stain on the biopsy is the usual test. HPV is rare in mouth (oral cavity) cancers, which are still mostly driven by tobacco and areca nut.",
 rib:"Check p16 in tonsil and tongue-base cancers; HPV ones do better",more:"See the guideline",u:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1437",likes:964},

{id:'rff',tr:'r',cat:'Radial forearm flap',ev:'Expert view',
 panels:[
  {bg:'butter',cap:["THIN FOREARM","SKIN."],ch:[{k:'flap',m:'happy',x:.5,l:'RFF'}]},
  {bg:'lilac',cap:["ALLEN TEST","FIRST."],ch:[{k:'vessel',c:'artery',m:'calm',x:.5,l:'RADIAL'}]},
  {bg:'pink',cap:["FITS A HALF","TONGUE."],ch:[{k:'tongue',m:'happy',x:.5}]},
  {bg:'mint',cap:["TONGUE MOVES,","SPEECH STAYS."],ch:[{k:'blob',m:'happy',x:.5}]}],
 head:"Forearm flap: thin and pliable for a moving tongue",
 take:"The radial forearm flap gives thin, flexible skin on a long, reliable vessel, ideal for half-tongue and floor-of-mouth defects where movement matters for speech and swallowing. Check the hand's back-up blood supply with an Allen test first. The forearm scar and skin graft are its main costs; a suprafascial harvest helps the graft take.",
 rib:"Thin, pliable forearm skin keeps a reconstructed tongue moving",more:"See the evidence",u:pm('radial forearm free flap hemiglossectomy reconstruction'),likes:1150},

{id:'margins',tr:'a',cat:'Margins',ev:'Cohort studies · Guideline',
 panels:[
  {bg:'mint',cap:["5 MM OF HEALTHY","TISSUE = CLEAR."],ch:[{k:'screen',t:'5 mm',x:.5}]},
  {bg:'butter',cap:["CHECK THE","REMOVED SPECIMEN."],ch:[{k:'doc',m:'calm',x:.5}]},
  {bg:'pink',cap:["RE-CUTTING THE BED","IS NOT ENOUGH."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'lilac',cap:["WIDE FIRST CUT,","INK IT."],ch:[{k:'tongue',m:'happy',x:.5}]}],
 head:"Check margins on the specimen, not just the wound bed",
 take:"A clear margin is at least 5 mm of healthy tissue on the final report; 1 to 5 mm is close. Frozen sections taken from the removed specimen predict local control better than samples from the wound bed, and re-cutting a positive bed margin does not fully restore safety. Plan a wide first cut and ink the specimen in theatre.",
 rib:"Aim for 5 mm clear margins and take frozen sections from the specimen",more:"See the evidence",u:pm('specimen-driven versus defect-driven margin oral tongue cancer local control'),likes:1406},

{id:'hopon',tr:'g',cat:'Osteoradionecrosis',ev:'RCT · HOPON 2019',
 fig:{type:'bars',title:'Bone death (ORN) at 6 months',unit:'%',bars:[{l:'30 hyperbaric oxygen sessions',v:6.4},{l:'No oxygen (antibiotics + mouthwash)',v:5.7,hi:1}],from:'Shaw et al., HOPON, IJROBP 2019',ch:'bone'},
 head:"Skip hyperbaric oxygen before extracting teeth after radiation",
 take:"The HOPON trial randomised 144 patients needing extractions or implants in a jaw that had received radiotherapy. Bone death at six months was 6.4% with 30 hyperbaric oxygen sessions and 5.7% without; everyone got antibiotics and mouthwash. Oxygen eased short-term discomfort but not long-term pain or quality of life. Gentle extraction with antibiotic cover is enough.",
 rib:"After radiotherapy, extract with antibiotic cover; skip routine HBO",more:"Read the trial",u:"https://eprints.whiterose.ac.uk/143209",likes:1199},

{id:'pmmc',tr:'r',cat:'Pectoralis major flap',ev:'Cohort studies',
 panels:[
  {bg:'pink',cap:["NO MICROSCOPE","TODAY?"],ch:[{k:'screen',t:'NO SCOPE',x:.5,w:1.4}]},
  {bg:'butter',cap:["CHEST MUSCLE","TO THE RESCUE."],ch:[{k:'flap',m:'happy',x:.5,l:'PMMC'}]},
  {bg:'mint',cap:["A LIFEBOAT","AFTER FAILURE."],ch:[{k:'doc',m:'happy',x:.5}]},
  {bg:'lilac',cap:["BULKY, SO PICK","THE RIGHT DEFECT."],ch:[{k:'blob',m:'calm',x:.5}]}],
 head:"The pectoralis flap is still a reliable workhorse",
 take:"The pectoralis major flap needs no microscope and no vessel joins, so it remains vital where free flaps are not possible, for frail patients, and as a lifeboat after a free flap fails. It is bulky and can pull on the neck, so it suits large defects and neck cover better than a thin, moving tongue.",
 rib:"No microscope or a failed free flap? Pectoralis major delivers",more:"See the evidence",u:pm('pectoralis major myocutaneous flap head and neck reconstruction free flap era'),likes:1288},

{id:'sentinel',tr:'a',cat:'Neck',ev:'RCTs · France and Japan',
 fig:{type:'bars',title:'2-year overall survival',unit:'%',bars:[{l:'Elective neck dissection',v:92.6},{l:'Sentinel node biopsy',v:88.7,hi:1}],from:'Garrel et al., JCO 2020 (equivalence trial)',ch:'node'},
 head:"Sentinel node biopsy can spare the neck in small mouth cancers",
 take:"Instead of removing all the neck nodes, a tracer finds the first node the cancer drains to, which is checked under the microscope. In a French trial of 279 patients, two-year survival was equivalent (88.7% vs 92.6%), with a shorter stay and better early shoulder function; a Japanese trial agreed. It needs nuclear medicine and an experienced team; without these, elective dissection remains the safe default.",
 rib:"Sentinel node biopsy: same survival as neck dissection, less harm",more:"See the evidence",u:'https://ascopost.com/news/october-2020/sentinel-node-biopsy-vs-neck-node-dissection-in-operable-oral-or-oropharyngeal-cancer-equivalence-trial',likes:1376},

{id:'adjuvant',tr:'a',cat:'Adjuvant therapy',ev:'RCTs · NEJM 2004',
 panels:[
  {bg:'pink',cap:["NODE BURSTS","ITS CAPSULE?"],ch:[{k:'node',m:'angry',x:.5,l:'ENE'}]},
  {bg:'lilac',cap:["OR CANCER AT","THE MARGIN?"],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'butter',cap:["RADIATION +","CISPLATIN."],ch:[{k:'vial',m:'calm',x:.5,l:'CISPLATIN'}]},
  {bg:'mint',cap:["OTHER RISKS:","RADIATION ALONE."],ch:[{k:'blob',m:'happy',x:.5}]}],
 head:"Add chemotherapy to radiation only when the risk is high",
 take:"Two large trials, later pooled, showed that adding cisplatin to radiotherapy after surgery helps mainly when cancer breaks through a lymph node's capsule (extranodal extension) or reaches a margin. For other risk factors, radiotherapy alone is usually enough. Ask pathology to report extranodal extension and margins clearly, because they decide the plan.",
 rib:"Extranodal extension or positive margin: add cisplatin to RT",more:"Read the trials",u:pm('Bernier Cooper postoperative chemoradiotherapy head and neck NEJM 2004'),likes:1190},

{id:'vessels',tr:'r',cat:'Vessel-depleted neck',ev:'Expert view',
 panels:[
  {bg:'pink',cap:["NECK SCARRED,","NO VESSELS."],ch:[{k:'vessel',c:'vein',m:'sad',x:.5}]},
  {bg:'butter',cap:["TRY LOW: TRANS-","VERSE CERVICAL."],ch:[{k:'vessel',c:'artery',m:'happy',x:.5}]},
  {bg:'lilac',cap:["OR CHEST AND","ARM VESSELS."],ch:[{k:'vessel',c:'vein',m:'happy',x:.5}]},
  {bg:'mint',cap:["MAP WITH CT","ANGIO FIRST."],ch:[{k:'screen',t:'CTA',x:.5}]}],
 head:"No vessels left in the neck? There are still options",
 take:"After previous surgery or radiation, usable neck vessels may be gone. The transverse cervical vessels low in the neck are often spared. The internal mammary vessels in the chest, or a cephalic vein swung up from the arm, can also work. Map the vessels with CT angiography before a redo case.",
 rib:"Transverse cervical or internal mammary vessels rescue the neck",more:"See the evidence",u:pm('vessel-depleted neck free flap recipient vessels'),likes:902},

{id:'adjuncts',tr:'g',cat:'Early detection',ev:'Meta-analysis · Cochrane',
 panels:[
  {bg:'lilac',cap:["BLUE LIGHT SAYS","ALL CLEAR..."],ch:[{k:'screen',t:'GLOW',x:.5}]},
  {bg:'pink',cap:["BUT LIGHTS","CAN MISS CANCER."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'butter',cap:["A BIOPSY GIVES","THE ANSWER."],ch:[{k:'doc',m:'happy',x:.5}]},
  {bg:'mint',cap:["LOOK, FEEL,","THEN BIOPSY."],ch:[{k:'lens',m:'happy',x:.5}]}],
 head:"Glowing lights and dyes cannot replace a biopsy",
 take:"Screening gadgets such as light-based scopes, dyes and brush tests promise quick answers, but Cochrane reviews find none accurate enough to replace a biopsy. They can help choose where to biopsy within a large patch. A careful look and feel by a trained clinician, then a biopsy of anything suspicious, remains the standard.",
 rib:"Lights and dyes can guide you; only a biopsy diagnoses cancer",more:"See the review",u:pm('Cochrane diagnostic tests oral cancer potentially malignant disorders adjuncts'),likes:845},

{id:'rtog1016',tr:'a',cat:'HPV and oropharynx',ev:'RCT · Lancet 2019',
 fig:{type:'bars',title:'5-year overall survival, HPV+ oropharynx',unit:'%',bars:[{l:'Radiotherapy + cetuximab',v:77.9},{l:'Radiotherapy + cisplatin',v:84.6,hi:1}],from:'RTOG 1016, Lancet 2019',ch:'vial'},
 head:"HPV throat cancer: cisplatin still beats cetuximab",
 take:"Hoping to treat HPV cancers more gently, trials swapped cisplatin for cetuximab alongside radiotherapy. In RTOG 1016, five-year survival was lower with cetuximab: 77.9% against 84.6%. The European De-ESCALaTE trial agreed. Gentler treatment needs proof first; cisplatin remains the standard partner for radiotherapy in fit patients.",
 rib:"With radiation for HPV throat cancer, cisplatin beats cetuximab",more:"Read the trial",u:pm('RTOG 1016 cetuximab cisplatin HPV oropharyngeal Lancet 2019'),likes:1022},

{id:'anticoag',tr:'r',cat:'Anastomosis',ev:'Meta-analyses',
 panels:[
  {bg:'lilac',cap:["A DRIP TO","PROTECT THE JOIN?"],ch:[{k:'vial',m:'calm',x:.5,l:'HEPARIN'}]},
  {bg:'butter',cap:["NO MORE","FLAPS SAVED."],ch:[{k:'flap',m:'calm',x:.5}]},
  {bg:'pink',cap:["MORE BLEEDING,","MORE HAEMATOMA."],ch:[{k:'blob',m:'worried',x:.5}]},
  {bg:'mint',cap:["A PERFECT JOIN","MATTERS MOST."],ch:[{k:'vessel',c:'artery',m:'happy',x:.5}]}],
 head:"Routine blood thinners do not save more flaps",
 take:"Heparin, aspirin and dextran are often given to protect the vessel join, but pooled studies show no clear gain in flap survival. Heavier anticoagulation raises the risk of neck haematoma, which can itself kill a flap. Standard clot prevention for the legs is enough; a technically perfect join matters more than any drug.",
 rib:"Routine heparin or aspirin doesn't save flaps; technique does",more:"See the evidence",u:pm('antithrombotic prophylaxis free flap head and neck meta-analysis'),likes:1098},

{id:'port',tr:'a',cat:'Adjuvant therapy',ev:'RCT · IJROBP 2001',
 panels:[
  {bg:'mint',cap:["SURGERY","IS DONE."],ch:[{k:'doc',m:'happy',x:.5}]},
  {bg:'pink',cap:["CELLS LEFT BEHIND","KEEP GROWING."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'butter',cap:["START RADIATION","WITHIN 6 WEEKS."],ch:[{k:'clock',x:.5}]},
  {bg:'lilac',cap:["WHOLE PACKAGE","UNDER 11 WEEKS."],ch:[{k:'blob',m:'happy',x:.5}]}],
 head:"Finish everything, surgery to last radiation, within 11 weeks",
 take:"Cancer cells left behind keep multiplying while the wound heals. A randomised study showed better control when the whole package, from surgery to the last radiotherapy session, was finished in under 11 weeks. Start radiotherapy within about six weeks of surgery. Wound problems, dental clearance and paperwork are the usual causes of delay.",
 rib:"Start RT within 6 weeks; finish everything within 11 weeks",more:"Read the trial",u:pm('Ang postoperative radiotherapy total treatment package time head neck 2001'),likes:1167},

{id:'dental',tr:'r',cat:'Dental rehab',ev:'Cohort studies',
 panels:[
  {bg:'pink',cap:["NEW JAW,","NO TEETH."],ch:[{k:'bone',m:'sad',x:.5}]},
  {bg:'lilac',cap:["PLAN IMPLANTS","WITH THE CUTS."],ch:[{k:'screen',t:'3D',x:.5}]},
  {bg:'butter',cap:["PLACE THEM","AT SURGERY."],ch:[{k:'doc',m:'happy',x:.5}]},
  {bg:'mint',cap:["BACK TO","CHEWING."],ch:[{k:'blob',m:'happy',x:.5}]}],
 head:"Plan the teeth when you plan the jaw",
 take:"A new jaw without teeth leaves patients unable to chew. Dental implants in a fibula flap survive well, and placing them at the first operation, guided by virtual planning, gets patients chewing months sooner. Radiation lowers implant success but does not rule it out. Involve the prosthodontist before surgery, not after.",
 rib:"Plan and place implants with the fibula to get patients chewing sooner",more:"See the evidence",u:pm('fibula free flap dental implant primary placement survival'),likes:933},

{id:'field',tr:'g',cat:'Genetics simplified',ev:'Concept · genomic studies',
 panels:[
  {bg:'butter',cap:["TOBACCO BATHES","THE WHOLE MOUTH."],ch:[{k:'blob',m:'worried',x:.5,l:'MOUTH'}]},
  {bg:'lilac',cap:["DAMAGE SPREADS","ACROSS THE LINING."],ch:[{k:'dna',m:'sad',x:.5}]},
  {bg:'pink',cap:["A SECOND CANCER","CAN POP UP."],ch:[{k:'tumour',m:'angry',x:.5}]},
  {bg:'mint',cap:["QUIT TOBACCO,","KEEP CHECKING."],ch:[{k:'doc',m:'happy',x:.5}]}],
 head:"Tobacco damages the whole lining, not just the tumour spot",
 take:"Tobacco bathes the entire mouth and throat, so genetic damage spreads across the lining, called field cancerisation. That is why second cancers appear years after a successful operation, and why new cancers can grow beside a clear scar. Lifelong check-ups, stopping tobacco and areca nut, and biopsy of new patches matter as much as the first surgery.",
 rib:"Tobacco damages the whole lining; check for second cancers for life",more:"See the evidence",u:pm('field cancerization head and neck second primary'),likes:1011},

{id:'mandible',tr:'a',cat:'Mandible',ev:'Cohort studies',
 panels:[
  {bg:'pink',cap:["CANCER TOUCHES","THE JAW."],ch:[{k:'bone',m:'worried',x:.5,l:'JAW'}]},
  {bg:'lilac',cap:["NO BONE BITE","ON CT?"],ch:[{k:'screen',t:'CT',x:.5}]},
  {bg:'butter',cap:["SHAVE THE","RIM ONLY."],ch:[{k:'doc',m:'calm',x:.5}]},
  {bg:'mint',cap:["JAW KEEPS","ITS SHAPE."],ch:[{k:'bone',m:'happy',x:.5}]}],
 head:"Keep the jaw rim when cancer only touches it",
 take:"When a gum or floor-of-mouth cancer sits next to the jaw without eating into it, removing just a rim of bone (marginal mandibulectomy) controls the cancer as well as removing a full segment, and keeps the jaw's shape. Deep bone invasion on CT, especially into the nerve canal, or a thin toothless jaw means a segmental resection.",
 rib:"No bone invasion on CT? A marginal mandibulectomy keeps the jaw intact",more:"See the evidence",u:pm('marginal mandibulectomy oncological outcome oral cancer'),likes:1084},
{id:'bonner',tr:'a',cat:'Systemic therapy',ev:'RCT · NEJM 2006',
 fig:{type:'bars',title:'Median overall survival',unit:' mo',bars:[{l:'Radiotherapy alone',v:29.3},{l:'Radiotherapy + cetuximab',v:49.0,hi:1}],from:'Bonner et al., NEJM 2006',ch:'vial'},
 head:"Cetuximab with radiation helps when cisplatin is unsafe",
 take:"In the Bonner trial, adding weekly cetuximab to radiotherapy for locally advanced head and neck cancer extended median survival from 29.3 to 49 months compared with radiotherapy alone. Later trials showed it is weaker than cisplatin, so today it partners radiotherapy only when cisplatin is unsafe, for example with kidney damage or hearing loss.",
 rib:"Cisplatin unsafe? Cetuximab is the radiotherapy partner",more:"Read the trial",u:pm('Bonner radiotherapy plus cetuximab head and neck NEJM 2006'),likes:880},

{id:'kn048',tr:'a',cat:'Immunotherapy',ev:'RCT · Lancet 2019',
 fig:{type:'bars',title:'Median survival, first-line recurrent/metastatic',unit:' mo',bars:[{l:'Cetuximab + chemo (EXTREME)',v:10.7},{l:'Pembrolizumab + chemo',v:13.0,hi:1}],from:'KEYNOTE-048, Lancet 2019',ch:'vial'},
 head:"Pembrolizumab is first-line for recurrent or metastatic disease",
 take:"KEYNOTE-048 made pembrolizumab the first treatment for recurrent or metastatic head and neck cancer. With chemotherapy it extended median survival from 10.7 to 13 months compared with the old cetuximab regimen. Given alone, it worked best when PD-L1 CPS was 20 or more. Check CPS on the biopsy before choosing.",
 rib:"Recurrent or metastatic: start with pembrolizumab, guided by CPS",more:"Read the trial",u:pm('KEYNOTE-048 pembrolizumab first-line recurrent metastatic head and neck Lancet 2019'),likes:1540},

{id:'cm141',tr:'a',cat:'Immunotherapy',ev:'RCT · NEJM 2016',
 fig:{type:'bars',title:'1-year overall survival',unit:'%',bars:[{l:'Standard single drug',v:16.6},{l:'Nivolumab',v:36.0,hi:1}],from:'CheckMate 141, NEJM 2016',ch:'vial'},
 head:"After platinum fails, nivolumab doubles one-year survival",
 take:"For cancer that came back within six months of platinum chemotherapy, CheckMate 141 compared nivolumab with standard single drugs. One-year survival more than doubled, 36% against 16.6%, with fewer serious side effects. It established immunotherapy for platinum-refractory disease; Tata Memorial's low-dose approach makes a version of this affordable in India.",
 rib:"Platinum-refractory disease: immunotherapy doubles one-year survival",more:"Read the trial",u:pm('CheckMate 141 nivolumab recurrent head and neck NEJM 2016'),likes:1210},

{id:'mach',tr:'a',cat:'Systemic therapy',ev:'Meta-analysis · MACH-NC',
 fig:{type:'stat',big:'6.5%',lines:['more patients alive at 5 years','when chemo is given with radiotherapy'],from:'MACH-NC meta-analysis (Pignon et al.)',ch:'vial'},
 head:"Chemo works best given alongside radiotherapy",
 take:"The MACH-NC meta-analysis pooled almost 100 trials and over 17,000 patients. Chemotherapy given at the same time as radiotherapy added about 6.5 extra survivors per 100 at five years, while chemotherapy before or after added little. The benefit fades in patients over 70. That is why concurrent cisplatin is the backbone of chemoradiation.",
 rib:"Chemotherapy helps most when given with radiotherapy, not before",more:"Read the paper",u:pm('Pignon MACH-NC meta-analysis chemotherapy head and neck cancer'),likes:990},

{id:'weekly',tr:'a',cat:'Adjuvant therapy',ev:'RCT · JCO 2018 · Tata Memorial',
 fig:{type:'bars',title:'2-year locoregional control',unit:'%',bars:[{l:'Weekly cisplatin 30 mg/m²',v:58.5},{l:'3-weekly cisplatin 100 mg/m²',v:73.1,hi:1}],from:'Noronha et al., JCO 2018',ch:'vial'},
 head:"Three-weekly cisplatin beats low-dose weekly with radiation",
 take:"Many centres give low weekly cisplatin with radiotherapy for convenience. A Tata Memorial trial, mostly in patients treated after surgery, found weekly 30 mg/m² controlled the cancer worse than 100 mg/m² every three weeks: 58.5% against 73.1% at two years. Use the three-weekly schedule whenever the patient can tolerate it.",
 rib:"With radiotherapy, give cisplatin 3-weekly rather than low-dose weekly",more:"Read the trial",u:pm('Noronha once-a-week versus once-every-3-weeks cisplatin chemoradiation J Clin Oncol 2018'),likes:1320},

{id:'areca',tr:'g',cat:'Early detection',ev:'IARC Monograph',
 scene:{bg:'butter',cap:['ARECA NUT ALONE','CAUSES CANCER'],ch:[{k:'blob',m:'worried',x:.3,l:'CHEWER'},{k:'tumour',m:'angry',x:.7,s:1}]},
 head:"Areca nut causes mouth cancer, even without tobacco",
 take:"The WHO cancer agency classes areca nut as a definite human carcinogen, even without tobacco. Gutkha, paan masala and betel quid with tobacco multiply the risk and also cause submucous fibrosis, a stiff, pale mouth that can turn cancerous. Asking every patient about chewing habits and advising them to stop is the cheapest cancer prevention in Indian practice.",
 rib:"Ask every patient about areca nut; it causes cancer even alone",more:"See the evidence",u:pm('IARC areca nut betel quid carcinogenic monograph'),likes:1660},

{id:'hpvvax',tr:'g',cat:'HPV and oropharynx',ev:'RCT · PLoS One 2013',
 fig:{type:'stat',big:'93%',lines:['fewer oral HPV 16/18 infections','after HPV vaccination'],from:'Herrero et al., Costa Rica Vaccine Trial',ch:'lens'},
 head:"HPV vaccination also protects the throat",
 take:"In the Costa Rica vaccine trial, vaccinated women had 93% fewer oral HPV 16 and 18 infections four years later; these are the infections behind most HPV throat cancers. The vaccine is given for cervical cancer, but it is expected to prevent throat cancers too. India now has an affordable home-made vaccine, so encourage it for adolescents.",
 rib:"HPV vaccination is likely to prevent throat cancers too",more:"Read the trial",u:pm('Herrero reduced prevalence oral HPV vaccination Costa Rica 2013'),likes:870},

{id:'petneck',tr:'a',cat:'Neck',ev:'RCT · NEJM 2016',
 fig:{type:'bars',title:'2-year overall survival',unit:'%',bars:[{l:'Planned neck dissection',v:81.5},{l:'PET-CT surveillance',v:84.9,hi:1}],from:'PET-NECK, Mehanna et al., NEJM 2016',ch:'node'},
 head:"A clear PET-CT after chemoradiation can spare the neck",
 take:"After chemoradiation for nodal disease, PET-NECK compared planned neck dissection for everyone with a PET-CT scan at 12 weeks, operating only when the scan was not clear. Two-year survival was the same (84.9% against 81.5%) while far fewer neck operations were needed, and it cost less. A clear 12-week PET-CT safely spares the neck.",
 rib:"Clear PET-CT 12 weeks after chemoradiation? Spare the neck",more:"Read the trial",u:pm('Mehanna PET-CT surveillance versus neck dissection advanced head and neck NEJM 2016'),likes:1105},

{id:'shoulder',tr:'a',cat:'Neck',ev:'RCT · Cancer 2008 · cohort studies',
 scene:{bg:'lilac',cap:['SPARE THE NERVE,','SAVE THE SHOULDER'],ch:[{k:'doc',m:'happy',x:.3},{k:'blob',m:'happy',x:.7,l:'SHOULDER'}]},
 head:"Spare the accessory nerve and start shoulder physio early",
 take:"Lifting the shoulder depends on the spinal accessory nerve, which neck dissection can stretch or cut. Preserve it whenever the cancer allows and avoid heavy traction in levels IIb and V. When the shoulder still droops, a randomised trial showed progressive resistance exercises reduced pain and disability. Refer to physiotherapy early, before a frozen shoulder sets in.",
 rib:"Spare the accessory nerve; start shoulder physiotherapy early",more:"See the evidence",u:pm('McNeely progressive resistance exercise shoulder dysfunction head and neck cancer'),likes:760},

{id:'leech',tr:'r',cat:'Flap failure',ev:'Cohort studies',
 scene:{bg:'pink',cap:['CONGESTED FLAP?','LEECHES BUY TIME'],ch:[{k:'flap',m:'worried',bad:true,x:.33},{k:'vial',m:'calm',x:.72,l:'CIPROFLOXACIN',s:1.05}]},
 head:"Leeches can rescue a congested flap, with antibiotic cover",
 take:"When a pedicled flap or replant is congested and the vein cannot be fixed surgically, medicinal leeches drain blood and buy time for new veins to grow in. Their gut bacterium, Aeromonas, can infect the flap, so give prophylactic antibiotics such as ciprofloxacin. In a free flap, explore the anastomosis first; leeches are a rescue, not a cure.",
 rib:"Leeches buy time for a congested flap; always add antibiotic cover",more:"See the evidence",u:pm('medicinal leech therapy venous congestion flap Aeromonas prophylaxis'),likes:940},

{id:'caprini',tr:'g',cat:'Postoperative care',ev:'Cohort studies',
 scene:{bg:'butter',cap:['LONG SURGERY','RAISES CLOT RISK'],ch:[{k:'blob',m:'worried',x:.3,l:'PATIENT'},{k:'vial',m:'happy',x:.7,l:'HEPARIN',s:1.05}]},
 head:"Score every patient for blood-clot risk after big surgery",
 take:"Clots in the legs and lungs are an avoidable killer after long head and neck operations. The Caprini score adds points for age, cancer, long surgery and immobility to find the highest-risk patients. Use stockings and calf pumps for everyone, add low-molecular-weight heparin in high scorers, and get patients walking early.",
 rib:"Score clot risk, give heparin to high scorers, mobilise early",more:"See the evidence",u:pm('Caprini risk venous thromboembolism head and neck free flap'),likes:690},

{id:'swallow',tr:'g',cat:'Postoperative care',ev:'Cohort studies',
 scene:{bg:'mint',cap:['SWALLOWING:','USE IT OR LOSE IT'],ch:[{k:'tongue',m:'happy',x:.33,l:'TONGUE'},{k:'blob',m:'happy',x:.7}]},
 head:"Keep patients swallowing during and after treatment",
 take:"Swallowing muscles weaken fast when they are not used during radiotherapy or after surgery. Starting swallowing exercises early, keeping some food by mouth when safe, and involving a swallow therapist before treatment are linked with better long-term swallowing and fewer permanent feeding tubes. Use it or lose it applies to the throat.",
 rib:"Start swallowing exercises before treatment; keep some oral intake",more:"See the evidence",u:pm('prophylactic swallowing exercises head and neck cancer radiotherapy outcomes'),likes:710},

{id:'trach',tr:'g',cat:'Postoperative care',ev:'Cohort studies',
 scene:{bg:'lilac',cap:['A TRACHEOSTOMY','FOR EVERYONE?'],ch:[{k:'doc',m:'calm',x:.3},{k:'blob',m:'worried',x:.7,l:'PATIENT'}]},
 head:"Tracheostomy by indication, not by habit",
 take:"A tracheostomy protects the airway after big mouth and jaw operations, but it adds hospital days, chest infections and distress. Selected patients with smaller resections and a secure airway can safely avoid one, and when it is placed, decannulating early once swelling settles shortens the stay. Decide case by case rather than by routine.",
 rib:"Tracheostomy only when indicated; decannulate as soon as safe",more:"See the evidence",u:pm('tracheostomy versus no tracheostomy free flap oral cavity reconstruction'),likes:650},

{id:'egfr',tr:'g',cat:'Genetics simplified',ev:'Biology · reviews',
 scene:{bg:'pink',cap:['TOO MANY GROWTH','SWITCHES (EGFR)'],ch:[{k:'tumour',m:'angry',x:.3,l:'EGFR HIGH'},{k:'vial',m:'happy',x:.7,l:'CETUXIMAB',s:1.05}]},
 head:"EGFR is the growth switch that cetuximab blocks",
 take:"Most head and neck cancers carry far too many EGFR receptors, the switches that tell cells to grow, and high EGFR is linked with poorer outcomes. Cetuximab is an antibody that blocks this switch. Unlike lung cancer, there is no useful EGFR mutation test in head and neck cancer, so cetuximab is given without testing.",
 rib:"EGFR is overactive in most cases; cetuximab blocks it, no test needed",more:"See the evidence",u:pm('EGFR overexpression head and neck squamous cell carcinoma prognosis review'),likes:600},

{id:'cps',tr:'g',cat:'Immunotherapy',ev:'Guideline · NCCN / KEYNOTE-048',
 fig:{type:'table',title:'What the PD-L1 combined positive score means',cols:['CPS','What it suggests'],w:[1,3],rows:[['Below 1','Immunotherapy alone unlikely to help'],['1 to 19','Pembrolizumab, usually with chemotherapy'],['20 or more','Pembrolizumab alone is a strong option']],hi:2,from:'KEYNOTE-048 and NCCN guidance'},
 head:"PD-L1 CPS decides the immunotherapy plan",
 take:"The combined positive score counts PD-L1 stained cancer and immune cells per 100 cancer cells. It predicts who benefits from immunotherapy: below 1, little benefit; 20 or more, pembrolizumab alone works well; in between, it is usually given with chemotherapy. Ask the pathologist for CPS on every biopsy of advanced disease.",
 rib:"Ask the pathologist for PD-L1 CPS on every advanced biopsy",more:"See the guideline",u:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1437",likes:1180},

{id:'brown',tr:'r',cat:'Maxillectomy',ev:'Classification · Lancet Oncol 2010',
 fig:{type:'table',title:'Brown classification of maxillectomy (simplified)',cols:['Class','What is removed','Typical choice'],w:[1,3,3],rows:[['I','Palate bone, no opening into the sinus','Local repair'],['II','Low maxilla, orbit floor kept','Obturator or soft-tissue flap'],['III','Includes the orbital floor','Bone flap: fibula or scapula'],['IV','Includes the eye (exenteration)','Large soft-tissue or bone flap'],['a-d','How much palate is lost','More palate, stronger case for bone']],from:'Brown and Shaw, Lancet Oncol 2010'},
 head:"Describe a maxillectomy by height and palate, then pick the flap",
 take:"Brown's classification describes a maxillectomy by how high it goes, from palate only up to the orbit, and by how much palate it takes, letters a to d. Low defects suit an obturator or soft-tissue flap. Once the orbital floor or a large part of the palate is lost, bone flaps such as fibula or scapular tip support the eye and future teeth best.",
 rib:"Class the defect by height and palate; orbital floor lost means bone",more:"Read the paper",u:pm('Brown Shaw reconstruction of the maxilla and midface classification Lancet Oncol 2010'),likes:820},

{id:'obturator',tr:'r',cat:'Maxillectomy',ev:'Cohort studies',
 scene:{bg:'butter',cap:['PLUG IT OR','REBUILD IT?'],ch:[{k:'screen',t:'OBTURATOR',w:1.6,x:.3},{k:'flap',m:'happy',x:.72,l:'FREE FLAP'}]},
 head:"Obturator for small palate defects, flap for large ones",
 take:"A dental obturator plugs a palate defect quickly and lets you inspect the cavity for recurrence, which suits small defects and frail patients. For larger defects, obturators leak, loosen and affect speech, and a free flap gives better speech, swallowing and quality of life. Involve the prosthodontist before surgery either way.",
 rib:"Small palate defect: obturator; large defect: free flap does better",more:"See the evidence",u:pm('obturator versus free flap maxillectomy quality of life'),likes:640},

{id:'dentalrt',tr:'g',cat:'Dental rehab',ev:'Guidelines · consensus',
 scene:{bg:'mint',cap:['FIX THE TEETH','BEFORE RADIATION'],ch:[{k:'bone',m:'happy',x:.3,l:'JAW'},{k:'doc',m:'happy',x:.7}]},
 head:"Dental clearance at least two weeks before radiotherapy",
 take:"Bad teeth in the radiation field are the commonest trigger for jaw bone death later. Get a dental assessment before radiotherapy, remove teeth with a poor outlook at least two weeks before treatment so the sockets heal, and give fluoride trays for life. A day spent on dental planning saves months of osteoradionecrosis care.",
 rib:"Extract doubtful teeth at least 2 weeks before radiotherapy starts",more:"See the evidence",u:pm('pre-radiotherapy dental extraction timing osteoradionecrosis prevention'),likes:930},

{id:'pentoclo',tr:'g',cat:'Osteoradionecrosis',ev:'Cohort studies',
 scene:{bg:'lilac',cap:['DEAD BONE','IN THE JAW'],ch:[{k:'bone',m:'sad',x:.3,l:'JAW'},{k:'vial',m:'happy',x:.7,l:'PENTO + VIT E',s:1.05}]},
 head:"Early bone death: try pentoxifylline with vitamin E",
 take:"For established bone death in an irradiated jaw, pentoxifylline with vitamin E, sometimes with clodronate, has healed or shrunk lesions over months in several series. It is cheap, oral and well tolerated. Severe cases with a fracture, fistula or exposed plate still need resection and a bone flap such as fibula.",
 rib:"Early ORN: pentoxifylline + vitamin E; advanced ORN: resect and flap",more:"See the evidence",u:pm('pentoxifylline tocopherol osteoradionecrosis mandible'),likes:780},

{id:'compart',tr:'a',cat:'Tongue cancer',ev:'Cohort studies',
 scene:{bg:'pink',cap:['TAKE THE WHOLE','TONGUE COMPARTMENT'],ch:[{k:'tongue',m:'worried',x:.3,l:'TONGUE'},{k:'doc',m:'calm',x:.7,l:'EN BLOC'}]},
 head:"For deeper tongue cancers, remove the compartment, not just the lump",
 take:"Tongue cancer spreads along muscles and lymph channels toward the floor of mouth and neck. Compartmental surgery removes the half-tongue with its outside muscles and the tissue between tongue and neck in one block. Series from Italy and India report better local control for deeper tumours. It needs good reconstruction, usually a free flap.",
 rib:"Deep tongue cancer: remove the compartment in one block",more:"See the evidence",u:pm('compartmental surgery tongue cancer local control'),likes:910},

{id:'nutrition',tr:'g',cat:'Postoperative care',ev:'Guideline · ESPEN',
 scene:{bg:'butter',cap:['FEED BEFORE','YOU OPERATE'],ch:[{k:'blob',m:'worried',x:.3,l:'WEIGHT LOSS'},{k:'vial',m:'happy',x:.7,l:'SUPPLEMENT',s:1.05}]},
 head:"Screen weight loss and feed patients before surgery",
 take:"Many mouth cancer patients arrive underweight because eating hurts. Malnutrition raises wound breakdown, fistula and flap problems. Check weight loss at the first visit, start high-protein supplements or tube feeding before surgery when needed, and restart feeding within a day after surgery. Good nutrition is cheap insurance for a flap.",
 rib:"Check weight loss at first visit; feed before and soon after surgery",more:"See the guideline",u:pm('ESPEN guideline clinical nutrition surgery head and neck cancer'),likes:720},

{id:'quit',tr:'g',cat:'Early detection',ev:'Cohort studies',
 scene:{bg:'mint',cap:['QUIT TOBACCO,','EVEN NOW'],ch:[{k:'blob',m:'happy',x:.3,l:'PATIENT'},{k:'tumour',m:'sad',x:.7,s:.95}]},
 head:"Quitting tobacco after diagnosis still improves outcomes",
 take:"Patients who keep smoking or chewing during treatment have more complications, worse radiotherapy results, more second cancers and lower survival. Stopping at diagnosis reverses part of this. Ask about tobacco at every visit, advise quitting clearly, and offer nicotine replacement or a cessation clinic referral. It costs little and helps a lot.",
 rib:"It is never too late: stopping tobacco at diagnosis improves survival",more:"See the evidence",u:pm('smoking cessation after diagnosis head and neck cancer survival'),likes:820},

{id:'fibharvest',tr:'r',cat:'Fibula flap',ev:'Expert view',
 scene:{bg:'lilac',cap:['LEAVE 6 CM','AT EACH END'],ch:[{k:'bone',m:'happy',x:.32,l:'FIBULA'},{k:'doc',m:'calm',x:.7}]},
 head:"Fibula harvest: leave 6 cm at the knee and ankle",
 take:"To keep the leg stable and the peroneal nerve safe, leave about 6 cm of fibula below the knee and above the ankle. Up to about 25 cm of straight bone can still be taken, enough for an angle-to-angle jaw. Check the leg's blood supply first, because some legs depend on the peroneal artery.",
 rib:"Keep 6 cm of fibula at both ends; image leg vessels first",more:"See the evidence",u:pm('fibula free flap harvest technique donor site morbidity'),likes:870},

{id:'ijv',tr:'r',cat:'Anastomosis',ev:'Expert view · cohort studies',
 scene:{bg:'butter',cap:['JOIN THE VEIN TO','THE JUGULAR SIDE'],ch:[{k:'vessel',c:'vein',m:'happy',x:.5,y:-20,s:1.1},{k:'vessel',c:'artery',m:'calm',x:.5,y:30,s:.9}]},
 head:"End-to-side to the internal jugular gives a reliable outflow",
 take:"When neck veins are small or damaged, joining the flap vein end-to-side into the internal jugular vein gives a large, steady outflow that is hard to kink. Many series report very low venous thrombosis with this technique. Keep the jugular vein during neck dissection when the cancer allows, so it is there for the flap.",
 rib:"Save the internal jugular vein; it makes an excellent flap outflow",more:"See the evidence",u:pm('end-to-side internal jugular vein anastomosis free flap'),likes:700},

{id:'trismus',tr:'a',cat:'Buccal cancer',ev:'Cohort studies',
 scene:{bg:'pink',cap:["CAN'T OPEN","THE MOUTH?"],ch:[{k:'blob',m:'worried',x:.3,l:'TRISMUS'},{k:'screen',t:'MRI',x:.7}]},
 head:"Trismus in cheek cancer: get an MRI before blaming fibrosis",
 take:"In cheek cancer, a tight mouth can come from pain, submucous fibrosis or cancer in the chewing muscles behind the jaw. MRI tells them apart: invasion of the pterygoid or masseter muscles upstages the tumour and changes the operation. Never assume trismus is just fibrosis; image it before planning.",
 rib:"Trismus in cheek cancer needs MRI; it may be muscle invasion",more:"See the evidence",u:pm('trismus buccal mucosa carcinoma masticator space MRI'),likes:760}

function face(x,y,m){
  let s='';
  if(m==='happy'||m==='calm') s+=`<ellipse cx="${x-15}" cy="${y+8}" rx="4.5" ry="2.8" fill="#FF7F98" opacity=".45"/><ellipse cx="${x+15}" cy="${y+8}" rx="4.5" ry="2.8" fill="#FF7F98" opacity=".45"/>`;
  [-8.5,8.5].forEach(dx=>{
    const px=x+dx+(m==='worried'?0:.6);
    if(m==='happy'){s+=`<path d="M${x+dx-4.5} ${y+1} Q${x+dx} ${y-6} ${x+dx+4.5} ${y+1}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;return;}
    s+=`<g class="eye"><ellipse cx="${x+dx}" cy="${y}" rx="4.6" ry="5.4" fill="#fff" stroke="${INK}" stroke-width="1.4"/><circle cx="${px}" cy="${y+1}" r="2.9" fill="${INK}"/><circle cx="${px+1.3}" cy="${y-.4}" r="1.1" fill="#fff"/></g>`;
  });

const CAT_ORDER=['Oncology news','Early detection','Genetics simplified','Tongue cancer','Buccal cancer','ITF clearance','Neck','Margins','Mandible','Maxillectomy','Adjuvant therapy','Immunotherapy','Systemic therapy','HPV and oropharynx','Anastomosis','ALT flap','Radial forearm flap','Fibula flap','Scapula flap','Pectoralis major flap','Flap monitoring','Flap failure','Vessel-depleted neck','Postoperative care','Dental rehab','Osteoradionecrosis'];
function renderChips(){
  const all=[...liveCards,...LIB], n={};all.forEach(c=>n[c.cat]=(n[c.cat]||0)+1);
  const cats=[...CAT_ORDER.filter(c=>n[c]),...Object.keys(n).filter(c=>!CAT_ORDER.includes(c)).sort()];
  $('chips').innerHTML=`<button class="chip" data-cat="" aria-pressed="${!topic}">All<i>${all.length}</i></button>`+cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===topic}">${esc(c)}<i>${n[c]}</i></button>`).join('');
  const on=$('chips').querySelector('[aria-pressed="true"]');on&&on.scrollIntoView({inline:'center',block:'nearest'});
}
