  if(pendingLive>0){p.className='pill live';p.textContent=`${pendingLive} new paper${pendingLive>1?'s':''} ↻`;p.tabIndex=0;return;}
  p.className='pill';p.tabIndex=-1;const u=unseenCount();p.textContent=tab==='saved'?`${Object.keys(S.saved).length} saved`:(u?'New for you':'All caught up');

function observe(){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{
    const el=e.target, id=el.dataset.id; el.classList.toggle('vis',e.isIntersecting);
    if(e.isIntersecting){
      if(!el.dataset.fit) fitCard(el);
      const nx=el.nextElementSibling; if(nx&&!nx.dataset.fit) fitCard(nx);
      const cards=feed.children; if(itemPos<items.length&&[...cards].indexOf(el)>=cards.length-6) renderMore();
    }
    if(e.isIntersecting&&el.id==='note-card') noteShown();
    if(!id)return;
    if(e.isIntersecting){seenTimer[id]=setTimeout(()=>{if(!S.seen.includes(id)){S.seen.push(id);persist();updatePill();onSeen();setTimeout(maybeRate,1500);}},800);}
    else clearTimeout(seenTimer[id]);
  }),{root:feed,threshold:.6});
  feed.querySelectorAll('.card:not([data-obs])').forEach(el=>{el.dataset.obs='1';io.observe(el);});
}

}

$('nb-topics').onclick=searchSheet; $('nb-me').onclick=profile; $('nb-home').onclick=()=>{tab='feed';topic=null;render();};
feed.addEventListener('click',e=>{
  const card=e.target.closest('.card[data-id]'), a=e.target.closest('[data-a]'); if(!card||!a)return;
  if(a.dataset.a==='like') toggle('liked',card); else if(a.dataset.a==='save') toggle('saved',card); else if(a.dataset.a==='more') moreSheet(byId(card.dataset.id)); else share(byId(card.dataset.id));
});
feed.addEventListener('dblclick',e=>{
  const img=e.target.closest('.img'), card=e.target.closest('.card[data-id]'); if(!img||!card)return;
  if(!S.liked[card.dataset.id]) toggle('liked',card);
  const b=img.querySelector('.burst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeSheet();
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&$('sheet').hidden&&$('acct').hidden){e.preventDefault();feed.scrollBy({top:(e.key==='ArrowDown'?1:-1)*feed.clientHeight,behavior:'smooth'});}
});

 {id:'t-itf1',icon:'leaf',cat:'ITF clearance · Type 1',img:'art/itf/masticator-levels.jpg',cred:'Steps from the manish & moni ITF series',
  tip:'Type 1 ITF clearance keeps the mandible: split it at the angle, clear the fossa to the skull base, then plate it back.',slides:[
  ['Open and swing the mandible','Make the incision and expose the jaw. Cut the mandible at the angle and swing it out of the way. Find and protect the lingual nerve, then detach the medial pterygoid from the inner mandible.'],
  ['Free the maxilla','Cut the zygoma together with the maxilla and down-fracture the maxilla. The front of the fossa is now open.'],
  ['Clear the upper fossa','Divide the temporalis and remove the coronoid. Separate the stylomandibular ligament. Find and tie the maxillary artery.'],

 {id:'t-alt',icon:'wave',cat:'ALT flap',tip:'Mark ALT perforators with a handheld Doppler before you prep the thigh.',slides:[
  ['Why it matters','Skin perforators of the anterolateral thigh vary in number and position, and occasionally none is usable. Knowing where they are before the incision lets you centre the skin paddle and avoid a wasted dissection.'],
  ['How to do it','Draw a line from the anterior superior iliac spine to the outer edge of the kneecap. Most perforators lie within a few centimetres of its midpoint. Mark every clear signal before scrubbing.'],
  ['Watch out','A Doppler can pick up deeper vessels that are not true skin perforators. Make the medial incision first, find the perforator, then commit the paddle around it.'],
  ['Have a plan B','If no good perforator appears, move to an anteromedial thigh flap, a muscle-carrying flap or the other thigh. Mention this backup when you take consent.']]},
 {id:'t-ink',icon:'drop',cat:'Margins',tip:'Ink and orient the specimen yourself before it leaves the theatre.',slides:[
  ['Why it matters','Tissue shrinks after removal, and an unoriented specimen makes it hard for the pathologist to say which margin is close. Your orientation decides whether a close margin can be re-cut accurately.'],
  ['How to do it','Mark anterior, superior and deep surfaces with sutures or coloured ink, and add a labelled sketch or photo for the pathologist.'],
  ['Frozen sections','Take frozen sections from the specimen edge itself, labelled by site, rather than scraps from the wound bed.'],
  ['Team habit','A two-minute specimen huddle with the pathologist on complex cases saves days of confusion later.']]},
 {id:'t-pedicle',icon:'loop',cat:'Anastomosis',tip:'Recheck the lie of the pedicle after you turn the head and close the neck.',slides:[
  ['Why it matters','Many early flap failures come from a kink, twist or pressure on the pedicle rather than a poor anastomosis.'],
  ['How to do it','Lay the pedicle in a gentle curve, return the head to its resting position and confirm flow. Check again after skin closure.'],
  ['Watch out','Drains, a tight closure, a haematoma and tracheostomy ties can all squeeze the pedicle. Keep drains away from the vessels.'],
  ['On the ward','Nurse the head in neutral, avoid tight ties around the neck, and tell the nurses which side the pedicle lies.']]},
 {id:'t-pinprick',icon:'drop',cat:'Flap monitoring',tip:'A pinprick tells you more than a glance: bright red blood within seconds is reassuring.',slides:[
  ['Healthy flap','Pink and warm, refills briskly after gentle pressure, and bleeds bright red after a fine needle prick.'],
  ['Vein in trouble','Dark, swollen skin that refills very fast and oozes dark blood points to a venous problem, the commonest cause of early failure.'],
  ['Artery in trouble','Pale, cool skin with slow refill and no bleeding after a pinprick suggests the inflow has stopped.'],
  ['Act fast','Either pattern means call the surgeon and prepare for theatre. Hours, not days, decide whether the flap can be saved.']]},
 {id:'t-dental',icon:'tooth',cat:'Osteoradionecrosis',tip:'Send every patient for a dental check before radiotherapy starts.',slides:[
  ['Why it matters','Infected or hopeless teeth inside the radiation field are the main trigger for jaw bone death years later.'],
  ['Timing','Remove teeth with a poor outlook early, ideally allowing about two weeks of healing before radiotherapy, without delaying cancer treatment.'],
  ['Protect the rest','Daily fluoride, good oral hygiene and regular dental reviews protect the remaining teeth for life.'],
  ['After radiotherapy','If an extraction is needed later, do it gently, with antibiotic cover and close follow-up.']]},
 {id:'t-feed',icon:'leaf',cat:'Postoperative care',tip:'Start feeding within a day of major head and neck surgery.',slides:[
  ['Why it matters','Many patients arrive undernourished, and keeping them starved after surgery slows healing and raises fistula and infection risk.'],
  ['How to do it','Start tube feeds on day one and build up to target over a few days with a dietitian guiding the plan.'],
  ['Watch out','In very malnourished patients, check sugar, potassium and phosphate as feeds restart, to catch refeeding problems early.'],
  ['Back to the mouth','Begin swallowing therapy as soon as the surgeon allows, to avoid long-term tube dependence.']]},
 {id:'t-allen',icon:'heart',cat:'Radial forearm flap',tip:'Do an Allen test before you raise a radial forearm flap.',slides:[
  ['Why it matters','The hand is fed by both the radial and ulnar arteries. Taking the radial artery is safe only if the ulnar side can supply the whole hand.'],
  ['How to do it','Press both arteries at the wrist, let the patient clench and open the fist, then release the ulnar artery. Colour should return to the whole palm within a few seconds.'],
  ['In doubt?','If refill is slow or unclear, confirm with a Doppler or a pulse oximeter on the thumb, or choose another flap.'],
  ['Donor site','Protect the thin tendon covering during harvest so the skin graft takes well.']]},
 {id:'t-nodes',icon:'leaf',cat:'Neck',tip:'Aim for a thorough neck dissection: a yield of 18 or more nodes is linked to better survival.',slides:[
  ['The evidence','Large database studies found that examining 18 or more lymph nodes in a neck dissection is linked with better survival, probably because fewer deposits are left behind.'],
  ['How to do it','Clear each level fully, send the levels separately labelled, and ask pathology to report total and positive node counts.'],
  ['A quality marker','Node yield reflects both surgical and pathology quality; audit your own numbers once a year.'],
  ['Keep the balance','Thoroughness must still protect the marginal mandibular, accessory and hypoglossal nerves.']]}

const TIP_FEATURE=['t-itf2','t-itf1'], TIP_FEATURE_UNTIL=Date.parse('2026-11-10T18:30:00Z');
function tipsForFeed(count){
  const d=tipDay(), PR=TIPS.filter(t=>t.kind!=='trial'), TR=TIPS.filter(t=>t.kind==='trial');
  let pr=PR.map((_,i)=>PR[(d+i)%PR.length]);
  if(Date.now()<TIP_FEATURE_UNTIL){const lead=TIP_FEATURE.map(id=>PR.find(t=>t.id===id)).filter(Boolean);pr=[...lead,...pr.filter(t=>!lead.includes(t))];}
  const tr=TR.map((_,i)=>TR[(d*2+i)%TR.length]);
  return Array.from({length:count},(_,k)=>k%2?tr[((k-1)/2)%tr.length]:pr[(k/2)%pr.length]);
}

/* ---------- resume where you left off, older cards on pull-down, invite a colleague, rate the app ---------- */
/* The feed opens on the newest card you have not seen. Cards you have already read are not repeated; pull down at the top
   (or tap "Load older cards" on the caught-up card) to bring them back, 10 at a time, most recently read first. */
const OLDER_BATCH=10, APP_URL='https://flapshots.drmanishtiwari.com';
let olderPool=[], atTopSince=Date.now();
const T_=e=>{try{if(typeof track==='function')track(e);}catch(_){}};
const pullHint=(()=>{const h=document.createElement('div');h.id='pullhint';h.className='pullhint';h.hidden=true;h.textContent='↓ Pull down for older cards';document.querySelector('.app').appendChild(h);return h;})();
function updateOlderHint(){
  const show=tab==='feed'&&olderPool.length>0&&feed.scrollTop<=2&&$('sheet').hidden;
  pullHint.hidden=!show; if(show) pullHint.style.top=(feed.offsetTop+10)+'px';
}
feed.addEventListener('scroll',()=>{if(feed.scrollTop>2)atTopSince=0;else if(!atTopSince)atTopSince=Date.now();updateOlderHint();},{passive:true});
function loadOlder(at){
  if(tab!=='feed')return 0;
  const shown=new Set([...feed.querySelectorAll('.card[data-id]')].map(x=>x.dataset.id));
  olderPool=olderPool.filter(c=>!shown.has(c.id)&&!S.hidden[c.id]);
  const batch=olderPool.splice(0,OLDER_BATCH);
  if(!batch.length){toast('No older cards here yet');updateOlderHint();return 0;}
  const H=feed.clientHeight, d=$('done-card');
  if(at==='done'&&d){
    d.insertAdjacentHTML('beforebegin',batch.map(cardHTML).join('')); observe();
    const i=[...feed.children].findIndex(x=>x.dataset.id===batch[0].id);
    if(i>=0) feed.scrollTo({top:i*H,behavior:'smooth'});
  } else {
    feed.insertAdjacentHTML('afterbegin',batch.slice().reverse().map(cardHTML).join('')); observe();
    feed.scrollTop=batch.length*H; /* absolute: the browser may already have shifted the view to keep the current card */ requestAnimationFrame(()=>feed.scrollBy({top:-H,behavior:'smooth'}));
  }
  T_('older-'+at); toast(`${batch.length} older card${batch.length>1?'s':''} loaded${olderPool.length?'':' (that is all)'}`);
  updateOlderHint(); return batch.length;
}
let pullY=null;
feed.addEventListener('touchstart',e=>{pullY=(feed.scrollTop<=2&&olderPool.length)?e.touches[0].clientY:null;},{passive:true});
feed.addEventListener('touchmove',e=>{if(pullY===null)return;pullHint.classList.toggle('arm',e.touches[0].clientY-pullY>70);},{passive:true});
feed.addEventListener('touchend',e=>{if(pullY===null)return;const t=e.changedTouches[0],dy=t?t.clientY-pullY:0;pullY=null;pullHint.classList.remove('arm');if(dy>70&&feed.scrollTop<=2)loadOlder('top');},{passive:true});
feed.addEventListener('wheel',e=>{if(e.deltaY<-20&&feed.scrollTop<=2&&atTopSince&&Date.now()-atTopSince>500&&!loadOlder.busy){loadOlder.busy=setTimeout(()=>loadOlder.busy=0,1000);loadOlder('top');}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&feed.scrollTop<=2&&$('sheet').hidden&&$('acct').hidden&&olderPool.length)loadOlder('top');});

    };
  }
}

function noteDue(){

function feedbackSheet(kind){

  const sh=openSheet(`<h3>Write to Dr Manish S. Tiwari</h3><p class="fb-by">Creator of FlapShots. Topic ideas, app changes, corrections: all welcome.</p>

/* ---- search ---- */
function searchSheet(){
  const n={};allCards().forEach(c=>n[c.cat]=(n[c.cat]||0)+1);
  const cats=[...CAT_ORDER.filter(c=>n[c]),...Object.keys(n).filter(c=>!CAT_ORDER.includes(c))];
  const sh=openSheet(`<h3>Search</h3><input class="sinput" id="sq" type="search" placeholder="Search trials, drugs, flaps, topics" autocomplete="off">
    <div id="sres" class="sres"></div><h3>Browse topics</h3><div class="grid" id="scats">${cats.map(c=>`<button data-topic="${esc(c)}" aria-pressed="${c===topic}">${esc(c)}</button>`).join('')}</div>`);
  const q=sh.querySelector('#sq'), out=sh.querySelector('#sres');
  q.oninput=()=>{
    const v=q.value.trim().toLowerCase(), words=v.split(/\s+/).filter(Boolean);
    const res=words.length?allCards().filter(c=>{const t=(c.head+' '+c.rib+' '+c.take+' '+c.cat+' '+c.ev).toLowerCase();return words.every(w=>t.includes(w));}).slice(0,30):[];
    out.innerHTML=res.map(c=>`<button class="sr" data-id="${esc(c.id)}"><b>${esc(c.rib)}</b><span>${esc(c.cat)} · ${esc(c.ev)}</span></button>`).join('')||(words.length?'<p>No cards match yet. New papers arrive regularly.</p>':'');
  };
  setTimeout(()=>q.focus(),60);
  out.onclick=e=>{const b=e.target.closest('.sr');if(!b)return;closeSheet();openCard(b.dataset.id);};
  sh.querySelector('#scats').onclick=e=>{const b=e.target.closest('[data-topic]');if(!b)return;topic=b.dataset.topic;tab='feed';closeSheet();render();};
}
function openCard(id){
  const c=byId(id);tab='feed';topic=c?c.cat:null;render(false);
  while(!feed.querySelector(`.card[data-id="${CSS.escape(id)}"]`)&&renderMore(BATCH));
  if(c&&!feed.querySelector(`.card[data-id="${CSS.escape(id)}"]`)){olderPool=olderPool.filter(x=>x.id!==id);feed.insertAdjacentHTML('afterbegin',cardHTML(c));observe();}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const els=[...feed.children];const i=els.findIndex(x=>x.dataset.id===id);if(i>=0)feed.scrollTop=i*feed.clientHeight;}));
}

  if(no)no.onclick=()=>{closeSheet();track('a2hs-later');};
  const ch=sh.querySelector('#a2-chrome');if(ch)ch.onclick=()=>{closeSheet();openInChrome();};
}
document.addEventListener('click',e=>{if(e.target.closest('#p-a2hs')){closeSheet();setTimeout(a2hsSheet,250);}});

if(new URLSearchParams(location.search).has('join')){

/* Install link: https://flapshots.drmanishtiwari.com/install (or ?install=1) opens straight to the install prompt. */
if(new URLSearchParams(location.search).has('install')&&!isStandalone()){
  history.replaceState(null,'',location.pathname);

  /* iPhone: let them read first; the picture guide appears after 5 swipes (see maybeA2HS). Android: offer one-tap install straight away. */
  if(!isIOS()){a2hsThisVisit=true;androidInstallScreen();}
}
async function loadCards(){
  for(const u of CARDS_URLS){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Math.floor(Date.now()/3e5),{cache:'no-store'});
      if(!r.ok)continue;
      const j=await r.json(), arr=Array.isArray(j)?j:(j.cards||[]);
      const next=arr.map(d=>({...d,id:'db-'+d.id,live:true})).filter(valid).map(c=>({...c,tr:['a','r','g'].includes(c.tr)?c.tr:'g',rib:c.rib||'New evidence',ev:c.ev||'New paper',likes:+c.likes||0})).sort((a,b)=>String(b.addedAt||'').localeCompare(String(a.addedAt||'')));
      if(!next.length)continue;
      return next;
    }catch(e){}
  }
  return null;
}
async function refreshLive(){
  const next=await loadCards();
  if(!next){if(!liveCards.length)liveStatus='Could not reach the live library just now; showing the built-in cards.';return;}
  const grew=next.length!==liveCards.length;
  liveCards=next; if(booted) renderChips();
  const last=next[0]?.addedAt?new Date(next[0].addedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):null;
  liveStatus=`New cards are added automatically from papers and news; latest ${last||'recently'}.`;
  if(!booted||!grew) return;
  const nNew=next.length-renderedLive;
  const onDone=(()=>{const d=$('done-card');if(!d)return false;const r=d.getBoundingClientRect(),f=feed.getBoundingClientRect();return Math.abs(r.top-f.top)<40;})();
  if(nNew>0){ if(onDone||!feed.querySelector('.card[data-id]')) render(); else {pendingLive=nNew;updatePill();} }
}
(async()=>{
  await refreshLive();
  const QS=new URLSearchParams(location.search), want=QS.get('c'), wantTip=QS.get('t');
  if(wantTip){const go=()=>{if(openTip(wantTip))sharedArrival('tip');};if(booted)go();else{const t=setInterval(()=>{if(booted){clearInterval(t);go();}},200);setTimeout(()=>clearInterval(t),15000);}}
  else if(want){const go=()=>{if(byId(want)){openCard(want);sharedArrival('card');}};if(booted)go();else{const t=setInterval(()=>{if(booted){clearInterval(t);go();}},200);setTimeout(()=>clearInterval(t),15000);}}
  setInterval(refreshLive,30*60e3);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){refreshLive();if(tagDay&&tagDay!==istDay())pushTags();}});
})();

if('serviceWorker' in navigator&&location.protocol==='https:'&&!pushOK()){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
